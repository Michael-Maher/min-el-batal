<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>مسابقة الاجتماع</title>
<meta name="theme-color" content="#0a0e27">
<link rel="icon" type="image/png" sizes="32x32" href="images/icon/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
<script>
/* View switch: ?view=screen is the audience (projector) window; anything else is the control window. */
var MT_VIEW = new URLSearchParams(location.search).get('view') === 'screen' ? 'screen' : 'control';
document.documentElement.className = 'view-' + MT_VIEW;
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e27; --bg2:#141937; --card:#1a2040;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.16);
  --gold:#FFD700; --gold-light:#FFE875; --gold-dark:#D4A017;
  --accent:#6C5CE7; --teal:#00CEC9;
  --correct:#00B894; --wrong:#FF6B6B;
  --text:#fff; --muted:rgba(255,255,255,.62);
}
html,body{height:100%}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.view-screen #mc-root{display:none}
.view-control #ms-root{display:none}

/* ═════════════════ AUDIENCE SCREEN ═════════════════ */
.view-screen body{overflow:hidden;background:
  radial-gradient(ellipse 70% 55% at 50% 0%,rgba(108,92,231,.38),transparent 70%),
  radial-gradient(ellipse 60% 50% at 0% 100%,rgba(0,206,201,.18),transparent 70%),
  radial-gradient(ellipse 60% 50% at 100% 100%,rgba(255,215,0,.12),transparent 70%),
  linear-gradient(180deg,#0d1233,#070a1c)}
.view-screen body.nocursor,.view-screen body.nocursor *{cursor:none!important}
#ms-root{position:fixed;inset:0;overflow:hidden}
.ms-lights{position:absolute;inset:-20%;pointer-events:none;background:conic-gradient(from 0deg at 50% -10%,transparent 0deg,rgba(255,255,255,.05) 8deg,transparent 16deg,transparent 40deg,rgba(255,255,255,.04) 48deg,transparent 56deg,transparent 300deg,rgba(255,255,255,.05) 308deg,transparent 316deg);animation:msSweep 14s ease-in-out infinite alternate}
@keyframes msSweep{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
#ms{position:relative;height:100vh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:'top' 'stage' 'teams';gap:1.6vh 1.4vw;padding:2vh 2vw}
/* RTL grid: the first column is on the right, so the item keeps the right and the board takes the left */
#ms.board{grid-template-columns:minmax(0,1fr) 28vw;grid-template-areas:'top board' 'stage board' 'teams board'}
#ms-top{grid-area:top}
#ms-stage{grid-area:stage}
#ms-teams{grid-area:teams}
#ms.board #ms-stage{padding:2.4vh 2vw}

/* top bar: segment tag + timer ring */
#ms-top{display:flex;align-items:center;justify-content:space-between;gap:2vw;min-height:11vh}
#ms-tags{display:flex;flex-wrap:wrap;align-items:center;gap:1vw}
.ms-tag{display:inline-flex;align-items:center;gap:.6vw;padding:1vh 1.6vw;border-radius:99px;white-space:nowrap;font-size:2.2vw;font-weight:900;line-height:1.3;background:linear-gradient(135deg,rgba(108,92,231,.45),rgba(0,206,201,.25));border:2px solid rgba(255,255,255,.22);box-shadow:0 6px 22px rgba(0,0,0,.35);animation:msPop .5s cubic-bezier(.34,1.56,.64,1)}
.ms-tag .lvl{color:var(--gold-light)}
.ms-tag.gold{background:linear-gradient(135deg,#FFE875,#D4A017);color:#2a1c00;border-color:#fff3b0;box-shadow:0 0 30px rgba(255,215,0,.6);animation:msPop .5s cubic-bezier(.34,1.56,.64,1),msGoldPulse 1.6s ease-in-out infinite}
.ms-tag.mode{font-size:2vw;background:rgba(255,255,255,.08)}
.ms-tag.mode .dot{width:1.4vw;height:1.4vw;border-radius:50%;background:var(--tc,#fff);box-shadow:0 0 12px var(--tc,#fff)}
@keyframes msGoldPulse{0%,100%{box-shadow:0 0 18px rgba(255,215,0,.45)}50%{box-shadow:0 0 42px rgba(255,215,0,.9)}}
@keyframes msPop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}

#ms-ring{width:11vh;height:11vh;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;visibility:hidden}
#ms-ring.on{visibility:visible}
#ms-ring svg{position:absolute;inset:0;transform:rotate(-90deg);width:100%;height:100%;filter:drop-shadow(0 0 18px rgba(255,215,0,.45))}
#ms-ring circle{fill:rgba(10,14,39,.7);stroke-width:8}
#ms-ring .bg{stroke:rgba(255,255,255,.1)}
#ms-ring .fg{fill:none;stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
#ms-ring .num{position:relative;font-size:5.2vh;font-weight:900;color:var(--gold);text-shadow:0 0 22px rgba(255,215,0,.7);line-height:1}
#ms-ring.urgent{animation:msShake .3s infinite}
#ms-ring.urgent .fg{stroke:var(--wrong)}
#ms-ring.urgent .num{color:var(--wrong);text-shadow:0 0 22px rgba(255,107,107,.9);animation:msBeat .5s infinite}
#ms-ring.done .fg{stroke:var(--wrong)}
#ms-ring.done .num{color:var(--wrong);font-size:4.4vh}
@keyframes msShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes msBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

/* stage */
#ms-stage{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:2.4vh 3vw;border-radius:2.4vw;background:linear-gradient(180deg,rgba(26,32,64,.9),rgba(8,11,30,.82));border:2px solid var(--border2);box-shadow:0 16px 48px rgba(0,0,0,.5),inset 0 0 60px rgba(108,92,231,.08);--pk:1;--ok:1}
#ms-stage.golden{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,215,0,.5),0 0 60px rgba(255,215,0,.35),inset 0 0 80px rgba(255,215,0,.12)}
#ms-stage.pop{animation:msStagePop .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes msStagePop{0%{transform:scale(.985)}40%{transform:scale(1.012);box-shadow:0 0 0 12px rgba(255,215,0,.2)}100%{transform:scale(1)}}
#ms-stage.tight{align-items:flex-start}
#ms-item{width:100%;display:flex;flex-direction:column;align-items:center;gap:2.2vh;text-align:center}

.ms-prompt{font-size:calc(var(--pk) * 6.4vw);font-weight:900;line-height:1.3;text-shadow:0 4px 18px rgba(0,0,0,.75);max-width:100%;overflow-wrap:anywhere}
.ms-prompt.in{animation:msTextIn .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes msTextIn{0%{opacity:0;transform:translateY(2vh) scale(.96);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
.ms-emoji{font-size:calc(var(--pk) * 13vw);line-height:1.25;letter-spacing:.06em;filter:drop-shadow(0 8px 30px rgba(0,0,0,.6))}
.ms-hint{font-size:calc(var(--ok) * 3vw);font-weight:800;color:var(--gold-light);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.ms-hint.big{font-size:calc(var(--ok) * 3.8vw)}

/* options */
.ms-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2vh 1.4vw;width:100%}
.ms-opt{display:flex;align-items:center;gap:1.2vw;padding:1.1vh 1.4vw;border-radius:1.4vw;border:3px solid rgba(255,255,255,.18);background:rgba(20,25,60,.9);font-size:calc(var(--ok) * 3.6vw);font-weight:800;line-height:1.35;text-align:right;transition:opacity .4s,filter .4s}
.ms-opt.in{animation:msOptIn .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes msOptIn{0%{opacity:0;transform:translateY(3vh) scale(.9)}100%{opacity:1;transform:none}}
.ms-letter{flex-shrink:0;width:1.7em;height:1.7em;border-radius:.4em;display:flex;align-items:center;justify-content:center;font-weight:900;background:rgba(108,92,231,.3);color:#b9b0ff;border:2px solid rgba(108,92,231,.6)}
.ms-opt:nth-child(1) .ms-letter{background:rgba(255,107,107,.22);color:#ff8f8f;border-color:rgba(255,107,107,.55)}
.ms-opt:nth-child(3) .ms-letter{background:rgba(0,206,201,.22);color:#5ff0ec;border-color:rgba(0,206,201,.55)}
.ms-opt:nth-child(4) .ms-letter{background:rgba(253,203,110,.22);color:#fdd88a;border-color:rgba(253,203,110,.55)}
.ms-opt .t{flex:1}
.ms-opt.right{background:linear-gradient(135deg,rgba(0,184,148,.55),rgba(0,184,148,.2));border-color:var(--correct);box-shadow:0 0 0 4px rgba(0,184,148,.35),0 10px 40px rgba(0,184,148,.45);animation:msRight .8s cubic-bezier(.34,1.56,.64,1)}
.ms-opt.right .ms-letter{background:var(--correct);color:#fff;border-color:#fff}
.ms-opt.dim{opacity:.32;filter:grayscale(.6)}
@keyframes msRight{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}

/* true/false */
.ms-tf{font-size:calc(var(--ok) * 4.2vw);font-weight:900;padding:1.6vh 3vw;border-radius:99px;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.3)}
.ms-tf-res{font-size:calc(var(--pk) * 7vw);font-weight:900;padding:1.4vh 4vw;border-radius:2vw;animation:msZoom .7s cubic-bezier(.34,1.56,.64,1)}
.ms-tf-res.yes{background:linear-gradient(135deg,rgba(0,184,148,.6),rgba(0,184,148,.2));border:4px solid var(--correct);box-shadow:0 0 60px rgba(0,184,148,.5)}
.ms-tf-res.no{background:linear-gradient(135deg,rgba(255,107,107,.6),rgba(255,107,107,.2));border:4px solid var(--wrong);box-shadow:0 0 60px rgba(255,107,107,.5)}
.ms-tf-res small{display:block;font-size:.42em;font-weight:800;opacity:.95}
@keyframes msZoom{0%{opacity:0;transform:scale(.3) rotate(-8deg)}100%{opacity:1;transform:none}}

/* clues */
.ms-clues{display:flex;flex-direction:column;gap:1.4vh;width:100%}
.ms-clue{display:flex;align-items:center;gap:1.4vw;padding:1.2vh 1.8vw;border-radius:1.4vw;background:rgba(20,25,60,.85);border:2px solid rgba(255,255,255,.14);font-size:calc(var(--ok) * 3.4vw);font-weight:800;line-height:1.35;text-align:right;opacity:.75}
.ms-clue.last{font-size:calc(var(--pk) * 5.6vw);font-weight:900;opacity:1;border-color:var(--gold);background:linear-gradient(135deg,rgba(255,215,0,.16),rgba(20,25,60,.9));box-shadow:0 0 34px rgba(255,215,0,.25)}
.ms-clue.in{animation:msClueIn .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes msClueIn{0%{opacity:0;transform:translateX(-6vw) scale(.92)}100%{transform:none}}
.ms-clue-n{flex-shrink:0;min-width:1.6em;height:1.6em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--gold);color:#2a1c00;font-weight:900;font-size:.8em}
.ms-clue .t{flex:1}

/* order + odd cards */
.ms-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:1.6vh 1.6vw;width:100%}
.ms-card{position:relative;display:flex;align-items:center;gap:1.2vw;padding:1.8vh 1.8vw;border-radius:1.4vw;background:rgba(20,25,60,.9);border:3px solid rgba(255,255,255,.18);font-size:calc(var(--ok) * 3.6vw);font-weight:800;line-height:1.35;text-align:right}
.ms-card.in{animation:msOptIn .55s cubic-bezier(.34,1.56,.64,1) both}
.ms-card .t{flex:1}
.ms-card.ord{border-color:var(--correct);background:linear-gradient(135deg,rgba(0,184,148,.35),rgba(20,25,60,.9))}
.ms-card.ord .ms-letter{background:var(--correct);color:#fff;border-color:#fff}
.ms-odd{grid-template-columns:repeat(2,1fr)}
.ms-odd .ms-card{justify-content:center;text-align:center;font-size:calc(var(--pk) * 5vw);font-weight:900;min-height:16vh}
.ms-odd .ms-card.odd{border-color:var(--wrong);background:linear-gradient(135deg,rgba(255,107,107,.5),rgba(20,25,60,.9));box-shadow:0 0 0 4px rgba(255,107,107,.35),0 0 50px rgba(255,107,107,.45);animation:msOddHit .9s ease-out}
.ms-odd .ms-card.odd::after{content:'🚫 ده الغريب!';position:absolute;top:-1.6vh;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:2.2vw;font-weight:900;padding:.3vh 1.2vw;border-radius:99px;background:var(--wrong);color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.ms-odd .ms-card.dim{opacity:.35;filter:grayscale(.6)}
@keyframes msOddHit{0%,100%{transform:none}15%,45%,75%{transform:translateX(-1vw) rotate(-2deg)}30%,60%,90%{transform:translateX(1vw) rotate(2deg)}}

/* anagram tiles */
.ms-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:1vw;direction:rtl}
.ms-tile{width:var(--tw);height:calc(var(--tw) * 1.15);display:flex;align-items:center;justify-content:center;font-size:calc(var(--tw) * .62);font-weight:900;border-radius:1vw;background:linear-gradient(180deg,#fff7d1,#f5c542);color:#3a2600;border-bottom:.6vh solid #b8860b;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.ms-tile.in{animation:msTileIn .55s cubic-bezier(.34,1.56,.64,1) both}
.ms-tile.ok{background:linear-gradient(180deg,#b9f6e4,#00B894);color:#00382b;border-bottom-color:#00775f;animation:msFlip .6s ease-out both}
.ms-tile.gap{background:none;box-shadow:none;border:none;width:calc(var(--tw) * .4)}
@keyframes msTileIn{0%{opacity:0;transform:translateY(-6vh) rotate(-20deg)}100%{opacity:1;transform:none}}
@keyframes msFlip{0%{transform:rotateY(90deg)}100%{transform:none}}

/* sixty counter */
.ms-counter{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:calc(var(--pk) * 28vh);height:calc(var(--pk) * 28vh);border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,.25),rgba(255,215,0,.04) 70%);border:4px solid var(--gold);box-shadow:0 0 50px rgba(255,215,0,.35)}
.ms-counter b{font-size:calc(var(--pk) * 14vh);line-height:1;font-weight:900;color:var(--gold);text-shadow:0 0 30px rgba(255,215,0,.7)}
.ms-counter span{font-size:calc(var(--pk) * 2.6vh);font-weight:800;color:var(--gold-light)}
.ms-counter.bump b{animation:msBump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes msBump{0%{transform:scale(1)}40%{transform:scale(1.45);color:#fff}100%{transform:scale(1)}}
.ms-row{display:flex;align-items:center;justify-content:center;gap:3vw;width:100%}
.ms-list{display:flex;flex-wrap:wrap;justify-content:center;gap:.8vh .8vw}
.ms-chip{padding:.6vh 1.2vw;border-radius:99px;font-size:calc(var(--ok) * 2.4vw);font-weight:800;background:rgba(0,184,148,.22);border:2px solid rgba(0,184,148,.6);animation:msPop .4s both}

/* fixed segment (act / draw / taboo) and hymn */
.ms-big-ico{font-size:calc(var(--pk) * 11vw);line-height:1.1;filter:drop-shadow(0 0 40px rgba(255,215,0,.45));animation:msFloat 2.6s ease-in-out infinite}
@keyframes msFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6vh)}}
.ms-seg-name{font-family:'Lalezar','Cairo',sans-serif;font-weight:400;font-size:calc(var(--pk) * 7vw);line-height:1.2;background:linear-gradient(135deg,#FFE875,#FFD700,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent}
.ms-hymn{font-size:calc(var(--pk) * 6vw);font-weight:900;line-height:1.5}
.ms-hymn .note{color:var(--gold)}

/* answer + explain */
.ms-answer{max-width:100%;padding:1.6vh 3vw;border-radius:1.6vw;background:linear-gradient(135deg,rgba(0,184,148,.45),rgba(0,184,148,.12));border:4px solid var(--correct);box-shadow:0 10px 44px rgba(0,184,148,.4);animation:msZoom .7s cubic-bezier(.34,1.56,.64,1)}
.ms-answer .lbl{font-size:calc(var(--ok) * 2.2vw);font-weight:900;color:#9ff5dc;letter-spacing:.05em}
.ms-answer .t{font-size:calc(var(--ok) * 4.4vw);font-weight:900;line-height:1.4;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.ms-explain{max-width:100%;padding:1.2vh 2.4vw;border-radius:1.4vw;background:#151b45;border:3px solid var(--gold);border-right-width:1.2vw;font-size:calc(var(--ok) * 2.8vw);font-weight:800;line-height:1.55;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);box-shadow:0 8px 30px rgba(0,0,0,.45);animation:msSlideUp .5s ease-out}
@keyframes msSlideUp{0%{transform:translateY(2vh)}100%{transform:none}}

/* idle */
.ms-idle{display:flex;flex-direction:column;align-items:center;gap:2.4vh}
.ms-idle .ico{font-size:16vh;line-height:1;filter:drop-shadow(0 0 50px rgba(255,215,0,.6));animation:msFloat 3s ease-in-out infinite}
.ms-idle h1{font-family:'Lalezar','Cairo',sans-serif;font-weight:400;font-size:9vw;line-height:1.15;background:linear-gradient(135deg,#FFE875,#FFD700,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px rgba(255,215,0,.35))}
.ms-idle p{font-size:3vw;font-weight:800;color:var(--muted)}
.ms-idle p.ready{color:var(--gold-light);animation:msBeat 1.2s ease-in-out infinite}

/* team strip */
#ms-teams{display:flex;gap:1.2vw;justify-content:center}
#ms-teams:empty{display:none}
.ms-team{position:relative;flex:1;min-width:0;max-width:30vw;display:flex;align-items:center;gap:1vw;padding:1vh 1vw;border-radius:1.4vw;background:linear-gradient(180deg,rgba(20,25,55,.92),rgba(8,11,30,.85));border:3px solid var(--border2);border-top:.9vh solid var(--tc);box-shadow:0 8px 26px rgba(0,0,0,.4)}
.ms-team.lead{border-color:var(--gold);border-top-color:var(--tc);box-shadow:0 0 0 2px var(--gold),0 0 36px rgba(255,215,0,.45)}
.ms-team .ico{flex-shrink:0;width:6.4vh;height:6.4vh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:4.2vh;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),var(--tc) 60%);border:2px solid rgba(255,255,255,.3);box-shadow:0 0 20px var(--tc)}
.ms-team .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:.4vh}
.ms-team .nm{font-size:1.9vw;font-weight:900;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-team .sc{align-self:flex-start;font-size:3.8vw;font-weight:900;line-height:1;color:var(--gold);text-shadow:0 0 16px rgba(255,215,0,.55)}
.ms-team .sc.bump{animation:msBump .7s cubic-bezier(.34,1.56,.64,1)}
.ms-team .crown{position:absolute;top:-4.6vh;right:calc(1.2vw + .9vh);font-size:5.6vh;line-height:1;z-index:2;filter:drop-shadow(0 4px 10px rgba(255,215,0,.8));animation:msCrown 2.4s ease-in-out infinite}
@keyframes msCrown{0%,100%{transform:rotate(-8deg)}50%{transform:translateY(-.6vh) rotate(8deg)}}
.ms-team .delta{position:absolute;top:-3vh;left:1.2vw;font-size:3vw;font-weight:900;padding:.2vh 1vw;border-radius:99px;background:var(--correct);box-shadow:0 6px 20px rgba(0,184,148,.6);animation:msDelta 1.6s forwards;pointer-events:none}
.ms-team .delta.neg{background:var(--wrong);box-shadow:0 6px 20px rgba(255,107,107,.6)}
@keyframes msDelta{0%{opacity:0;transform:translateY(3vh) scale(.5)}20%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:translateY(-1vh)}100%{opacity:0;transform:translateY(-4vh)}}

/* individual board (side panel) */
#ms-board{grid-area:board;display:none;flex-direction:column;gap:1.2vh;min-height:0;padding:1.6vh .9vw;border-radius:1.6vw;background:linear-gradient(180deg,rgba(26,32,64,.92),rgba(8,11,30,.88));border:2px solid rgba(255,215,0,.35);box-shadow:0 16px 48px rgba(0,0,0,.5)}
#ms.board #ms-board{display:flex}
#ms-root.fxfull #ms-board{visibility:hidden}
.mb-title{display:flex;align-items:center;justify-content:center;gap:.6vw;font-family:'Lalezar','Cairo',sans-serif;font-size:3.9vh;line-height:1.2;text-align:center}
.mb-title .g,.fxb-title .g{background:linear-gradient(135deg,#FFE875,#FFD700,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent}
#mb-secs{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.2vh}
.mb-sec{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:.6vh}
.mb-h{font-size:2.6vh;font-weight:900;color:var(--gold-light);padding:0 .4vw;border-bottom:2px solid rgba(255,215,0,.25)}
.mb-vp{position:relative;flex:1;min-height:0;overflow:hidden}
.mb-row{position:relative;display:flex;align-items:center;gap:.45vw;min-height:5.6vh;margin-bottom:.7vh;padding:.3vh .5vw;border-radius:1vh;background:rgba(20,25,60,.95);border:2px solid rgba(255,255,255,.12);font-size:3vh;font-weight:900;line-height:1}
.mb-row.zero{opacity:.55}
.mb-row.r1{background:linear-gradient(90deg,rgba(255,215,0,.05),rgba(255,215,0,.32));border-color:rgba(255,215,0,.75)}
.mb-row.r2{background:linear-gradient(90deg,rgba(220,220,230,.04),rgba(220,220,230,.24));border-color:rgba(220,220,230,.6)}
.mb-row.r3{background:linear-gradient(90deg,rgba(205,127,50,.05),rgba(205,127,50,.3));border-color:rgba(205,127,50,.7)}
.mb-rk{flex-shrink:0;width:3.8vh;text-align:center;font-size:3.2vh;color:var(--gold-light)}
.mb-dot{flex-shrink:0;width:1.3vh;height:1.3vh;border-radius:50%;background:var(--tc,rgba(255,255,255,.25));box-shadow:0 0 8px var(--tc,transparent)}
/* names never get an ellipsis: a long name shrinks (to 2.8vh at the least in the panel) and, only if it still does not fit, wraps to two lines.
   The panel is 28vw wide so two- and three-part names up to ~18 letters stay on one line at that size. */
.mb-nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;line-height:1.55}
.mb-nm.wrap{white-space:normal;line-height:1.3}
.mb-st .s{font-size:.72em}
.mb-st{flex-shrink:0;color:var(--gold);text-shadow:0 0 12px rgba(255,215,0,.45)}
.mb-st.bump{display:inline-block;animation:msBump .7s cubic-bezier(.34,1.56,.64,1)}
.mb-row.hit{animation:mbHit 1.6s ease-out 3}
@keyframes mbHit{0%,55%{opacity:1;background:rgba(0,184,148,.75);border-color:#7dffd9;box-shadow:0 0 0 .5vh rgba(0,184,148,.5),0 0 30px rgba(0,184,148,.8)}100%{box-shadow:0 0 0 0 rgba(0,184,148,0)}}
.mb-row.enter{animation:mbEnter .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes mbEnter{0%{opacity:0;transform:translateX(-6vw)}100%{opacity:1;transform:none}}
.mb-row.gone{position:absolute;left:0;right:0;pointer-events:none;animation:mbGone .5s forwards}
@keyframes mbGone{to{opacity:0;transform:scale(.9)}}

/* full-screen board fx */
.fx-dim.solid{background:radial-gradient(ellipse at 50% 30%,rgba(40,30,90,.97),rgba(5,7,20,.99) 75%)}
.fx-board{position:absolute;inset:3vh 2.4vw;display:flex;flex-direction:column;gap:2vh;--bk:1}
.fxb-title{display:flex;align-items:center;justify-content:center;gap:1vw;font-family:'Lalezar','Cairo',sans-serif;font-size:min(4.4vw,8vh);line-height:1.15;animation:msZoom .6s cubic-bezier(.34,1.56,.64,1)}
.fxb-levels{flex:1;min-height:0;display:flex;gap:2vw}
.fxb-lvl{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:1.2vh}
.fxb-h{font-size:calc(var(--bk) * 3.6vh);font-weight:900;color:var(--gold-light);text-align:center;padding-bottom:.6vh;border-bottom:3px solid rgba(255,215,0,.35)}
.fxb-list{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:calc(var(--bk) * .9vh) 1vw;align-content:start}
.fxb-list .mb-row{min-height:0;height:calc(var(--bk) * 6vh);margin:0;font-size:calc(var(--bk) * 3.3vh);animation:mbEnter .5s cubic-bezier(.34,1.56,.64,1) both}
.fxb-list .mb-rk{width:calc(var(--bk) * 4.8vh);font-size:calc(var(--bk) * 3.4vh)}
.fxb-empty{font-size:3vh;font-weight:800;color:var(--muted);text-align:center;padding-top:4vh}

/* fullscreen button */
#ms-fs{flex-shrink:0;padding:1.2vh 1.8vw;border-radius:99px;border:2px solid rgba(255,255,255,.3);background:rgba(20,25,60,.8);color:#fff;font-size:1.6vw;font-weight:900;backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.45)}
#ms-fs:hover{background:rgba(108,92,231,.55)}
#ms-fs.hide{display:none}

/* ═════════════════ FX OVERLAY ═════════════════ */
#ms-fx{position:fixed;inset:0;z-index:9000;pointer-events:none;display:none;align-items:center;justify-content:center;flex-direction:column}
#ms-fx.on{display:flex;animation:msFadeIn .3s}
#ms-fx.out{animation:msFadeOut .4s forwards}
@keyframes msFadeIn{from{opacity:0}to{opacity:1}}
@keyframes msFadeOut{to{opacity:0}}
#ms-confetti{position:fixed;inset:0;pointer-events:none;z-index:9500;display:none}
#ms-confetti.on{display:block}
.fx-dim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(20,25,60,.55),rgba(5,7,20,.94) 70%)}
.fx-col{position:relative;display:flex;flex-direction:column;align-items:center;gap:2.4vh;text-align:center;padding:0 4vw}
.fx-title{display:flex;align-items:center;gap:1.4vw;font-family:'Lalezar','Cairo',sans-serif;font-weight:400;font-size:6vw;line-height:1.2;animation:msZoom .6s cubic-bezier(.34,1.56,.64,1)}
.fx-title .g{background:linear-gradient(135deg,#FFE875,#FFD700,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(255,215,0,.45))}
.fx-sub{font-size:3vw;font-weight:800;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.7)}

/* award pop */
.fx-burst{position:absolute;width:150vh;height:150vh;border-radius:50%;background:conic-gradient(from 0deg,var(--tc) 0deg,transparent 12deg,var(--tc) 24deg,transparent 36deg,var(--tc) 48deg,transparent 60deg,var(--tc) 72deg,transparent 84deg,var(--tc) 96deg,transparent 108deg,var(--tc) 120deg,transparent 132deg,var(--tc) 144deg,transparent 156deg,var(--tc) 168deg,transparent 180deg,var(--tc) 192deg,transparent 204deg,var(--tc) 216deg,transparent 228deg,var(--tc) 240deg,transparent 252deg,var(--tc) 264deg,transparent 276deg,var(--tc) 288deg,transparent 300deg,var(--tc) 312deg,transparent 324deg,var(--tc) 336deg,transparent 348deg);opacity:.28;-webkit-mask:radial-gradient(circle,transparent 8%,#000 30%,transparent 70%);mask:radial-gradient(circle,transparent 8%,#000 30%,transparent 70%);animation:fxRays 6s linear infinite}
@keyframes fxRays{to{transform:rotate(360deg)}}
.fx-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:1.2vh;padding:4vh 6vw;border-radius:3vw;background:linear-gradient(160deg,rgba(26,32,64,.96),rgba(8,11,30,.96));border:.6vh solid var(--tc);box-shadow:0 0 0 1vh rgba(255,255,255,.06),0 0 120px var(--tc);animation:fxCardIn .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes fxCardIn{0%{opacity:0;transform:scale(.2) rotate(-12deg)}100%{opacity:1;transform:none}}
.fx-name{font-size:9vw;font-weight:900;line-height:1.15;text-shadow:0 6px 30px rgba(0,0,0,.6),0 0 40px var(--tc)}
/* the points never fade: they scale in at full opacity so they read from the first frame to the last */
.fx-pts{position:relative;z-index:1;font-size:12vw;font-weight:900;line-height:1;color:#FFE34D;-webkit-text-stroke:.35vw #3a2600;paint-order:stroke fill;text-shadow:0 0 50px rgba(255,215,0,.9),0 8px 0 #7a5200,0 12px 24px rgba(0,0,0,.7);animation:fxPts .7s cubic-bezier(.34,1.56,.64,1)}
.fx-pts.neg{color:#ff7b7b;-webkit-text-stroke-color:#4a0000;text-shadow:0 0 50px rgba(255,107,107,.85),0 8px 0 #7a1010,0 12px 24px rgba(0,0,0,.7)}
@keyframes fxPts{0%{transform:scale(.55)}60%{transform:scale(1.2)}100%{transform:none}}
.fx-team-chip{display:inline-flex;align-items:center;gap:1vw;font-size:3vw;font-weight:900;padding:.6vh 2vw;border-radius:99px;background:var(--tc);box-shadow:0 0 30px var(--tc);text-shadow:0 2px 8px rgba(0,0,0,.5)}

/* team flash */
.fx-band{position:absolute;inset:0;background:var(--tc);animation:fxBand 2.2s ease-out forwards}
@keyframes fxBand{0%{opacity:0}12%{opacity:.92}40%{opacity:.75}100%{opacity:.55}}
.fx-band::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);animation:fxShine 1.2s .2s ease-out both}
@keyframes fxShine{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.fx-team-name{font-size:8vw;font-weight:900;line-height:1.2;text-shadow:0 6px 30px rgba(0,0,0,.55);animation:fxCardIn .7s cubic-bezier(.34,1.56,.64,1)}
.fx-team-ico{font-size:14vh;line-height:1;filter:drop-shadow(0 8px 30px rgba(0,0,0,.4));animation:fxCardIn .6s cubic-bezier(.34,1.56,.64,1)}

/* reveal flash */
.fx-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,215,0,.5),rgba(255,215,0,0) 65%);animation:fxFlash .9s ease-out forwards}
@keyframes fxFlash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

/* wheel */
.fx-wheel-wrap{position:relative;width:58vh;height:58vh}
.fx-wheel{position:absolute;inset:0;border-radius:50%;border:1.2vh solid #fff3b0;box-shadow:0 0 0 .6vh var(--gold-dark),0 0 80px rgba(255,215,0,.5),inset 0 0 40px rgba(0,0,0,.35);overflow:hidden}
.fx-wl{position:absolute;left:50%;top:0;height:50%;transform-origin:50% 100%;display:flex;justify-content:center}
.fx-wl span{display:block;margin-top:5vh;font-size:3vh;font-weight:900;line-height:1.3;text-align:center;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.75)}
.fx-wheel-hub{position:absolute;left:50%;top:50%;width:11vh;height:11vh;margin:-5.5vh 0 0 -5.5vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7d1,#D4A017);border:.6vh solid #fff;box-shadow:0 0 30px rgba(255,215,0,.7);display:flex;align-items:center;justify-content:center;font-size:5vh}
.fx-wheel-ptr{position:absolute;left:50%;top:-4.4vh;margin-left:-3vh;width:0;height:0;border-left:3vh solid transparent;border-right:3vh solid transparent;border-top:7vh solid #fff;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6));z-index:2}
.fx-result{font-size:4.6vw;font-weight:900;padding:1.4vh 3vw;border-radius:2vw;background:linear-gradient(135deg,#FFE875,#D4A017);color:#2a1c00;box-shadow:0 0 60px rgba(255,215,0,.7);animation:fxCardIn .7s cubic-bezier(.34,1.56,.64,1)}
.fx-wheel-row{position:relative;display:flex;flex-direction:column;align-items:center;padding-bottom:12vh}
.fx-result-wrap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center}
.fx-result-wrap .fx-result{flex-shrink:0;width:max-content;max-width:90vw;text-align:center}

/* name pick reel */
.fx-reel{min-width:60vw;padding:3vh 4vw;border-radius:3vw;background:linear-gradient(180deg,#0b0f26,#1a2040 50%,#0b0f26);border:.8vh solid var(--gold);box-shadow:0 0 0 1vh rgba(255,215,0,.15),0 0 90px rgba(255,215,0,.35),inset 0 0 50px rgba(0,0,0,.8);overflow:hidden}
.fx-reel-name{font-size:8vw;font-weight:900;line-height:1.3;white-space:nowrap}
.fx-reel-name.roll{animation:fxRoll .12s linear}
@keyframes fxRoll{0%{transform:translateY(-60%);opacity:.3}100%{transform:none;opacity:1}}
.fx-reel.landed{border-color:var(--correct);box-shadow:0 0 0 1vh rgba(0,184,148,.25),0 0 120px rgba(0,184,148,.6)}
.fx-reel.landed .fx-reel-name{color:var(--gold);text-shadow:0 0 40px rgba(255,215,0,.8);animation:msBump .8s cubic-bezier(.34,1.56,.64,1)}

/* bet + golden */
.fx-bet-amt{font-size:12vw;font-weight:900;line-height:1;color:var(--gold);text-shadow:0 0 50px rgba(255,215,0,.8);animation:fxPts .9s .3s cubic-bezier(.34,1.56,.64,1) both}
.fx-rules{display:flex;gap:2vw;font-size:2.8vw;font-weight:900}
.fx-rules span{padding:1vh 2vw;border-radius:99px}
.fx-rules .w{background:rgba(0,184,148,.3);border:2px solid var(--correct)}
.fx-rules .l{background:rgba(255,107,107,.3);border:2px solid var(--wrong)}
.fx-rays{position:absolute;width:140vh;height:140vh;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,215,0,.55),transparent 15deg,rgba(255,215,0,.55) 30deg,transparent 45deg,rgba(255,215,0,.55) 60deg,transparent 75deg,rgba(255,215,0,.55) 90deg,transparent 105deg,rgba(255,215,0,.55) 120deg,transparent 135deg,rgba(255,215,0,.55) 150deg,transparent 165deg,rgba(255,215,0,.55) 180deg,transparent 195deg,rgba(255,215,0,.55) 210deg,transparent 225deg,rgba(255,215,0,.55) 240deg,transparent 255deg,rgba(255,215,0,.55) 270deg,transparent 285deg,rgba(255,215,0,.55) 300deg,transparent 315deg,rgba(255,215,0,.55) 330deg,transparent 345deg);-webkit-mask:radial-gradient(circle,transparent 10%,#000 25%,transparent 68%);mask:radial-gradient(circle,transparent 10%,#000 25%,transparent 68%);animation:fxRays 9s linear infinite}
.fx-medal{font-size:22vh;line-height:1;filter:drop-shadow(0 0 60px rgba(255,215,0,.9));animation:fxCardIn .8s cubic-bezier(.34,1.56,.64,1)}

/* podium */
.fx-podium{display:flex;align-items:flex-end;justify-content:center;gap:2vw}
.fx-step{display:flex;flex-direction:column;align-items:center;gap:1vh;width:24vw;animation:fxRise .9s cubic-bezier(.34,1.56,.64,1) backwards}
.fx-step.s1{animation-delay:.9s}
.fx-step.s2{animation-delay:.3s}
.fx-step.s3{animation-delay:0s}
@keyframes fxRise{from{opacity:0;transform:translateY(20vh) scale(.6)}to{opacity:1;transform:none}}
.fx-step .md{font-size:7vh;line-height:1}
.fx-step .nm{font-size:3.4vw;font-weight:900;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.fx-step .st{font-size:2.8vw;font-weight:900;color:var(--gold)}
.fx-step .base{width:100%;border-radius:1.4vw 1.4vw 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:1.4vh;font-size:7vh;font-weight:900;color:#2a1c00}
.fx-step.s1 .base{height:22vh;background:linear-gradient(180deg,#FFE875,#D4A017);box-shadow:0 0 60px rgba(255,215,0,.6)}
.fx-step.s2 .base{height:15vh;background:linear-gradient(180deg,#f3f4f6,#9ca3af)}
.fx-step.s3 .base{height:10vh;background:linear-gradient(180deg,#fbbf24,#b45309)}
.fx-step.s1 .nm{font-size:4.2vw;color:var(--gold-light);text-shadow:0 0 30px rgba(255,215,0,.6)}
.fx-win-team{display:flex;align-items:center;gap:1.4vw;padding:1.4vh 3vw;border-radius:99px;background:var(--tc);box-shadow:0 0 60px var(--tc);font-size:3.4vw;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.5);animation:fxCardIn .8s 1.5s cubic-bezier(.34,1.56,.64,1) backwards}

/* ═════════════════ AUDIENCE THEME: LEVEL IDENTITY + LIVELIER STAGE ═════════════════
   Level 1 = warm, sunny, playful: gold/orange, round shapes, bouncy motion, 🌟.
   Level 2 = deep, cool, sleek: violet/indigo/electric blue, sharp corners, glow and shine, ⚡. */
.lv1{--lv-a:#ffd166;--lv-b:#ff9f1c;--lv-c:#ff6b35;--lv-ink:#3a1d00;--lv-glow:rgba(255,183,3,.65);--lv-soft:rgba(255,170,30,.16);--lv-line:rgba(255,190,60,.55);--lv-r:2.6vh}
.lv2{--lv-a:#a78bfa;--lv-b:#6d5dfc;--lv-c:#22d3ee;--lv-ink:#fff;--lv-glow:rgba(110,90,255,.75);--lv-soft:rgba(110,90,255,.18);--lv-line:rgba(140,120,255,.6);--lv-r:.5vh}

/* backdrop: the game's night-sea art, dimmed, with drifting light particles (canvas) on top */
#ms-bg{position:absolute;inset:-2%;background:url('images/ui/bg-hub-night.webp') center 35%/cover no-repeat;filter:blur(4px) saturate(1.25) brightness(.42)}
#ms-sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ms-lights{mix-blend-mode:screen}

/* segment tag: the level gets its own pill */
.ms-tag.lv{border:none;color:var(--lv-ink);background:linear-gradient(135deg,var(--lv-a),var(--lv-b));box-shadow:0 0 26px var(--lv-glow),0 6px 18px rgba(0,0,0,.35)}
.ms-tag.lv1{border-radius:99px;animation:msPop .5s cubic-bezier(.34,1.56,.64,1),lvBounce 2.4s ease-in-out .6s infinite}
.ms-tag.lv2{border-radius:.6vw;position:relative;overflow:hidden;animation:msPop .5s cubic-bezier(.34,1.56,.64,1)}
.ms-tag.lv2::after,.lv2-shine::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(120%);animation:lvShine 3.2s ease-in-out infinite}
.ms-tag.lvall{border:none;color:#fff;background:linear-gradient(90deg,#ff9f1c,#ffd166 45%,#a78bfa 55%,#6d5dfc);text-shadow:0 2px 6px rgba(0,0,0,.45);box-shadow:0 0 22px rgba(255,200,120,.35),0 0 22px rgba(110,90,255,.35)}
@keyframes lvBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-.6vh)}}
@keyframes lvShine{0%,55%{transform:translateX(120%)}100%{transform:translateX(-120%)}}
#ms-stage.t1{border-color:rgba(255,190,60,.55);box-shadow:0 16px 48px rgba(0,0,0,.5),inset 0 0 70px rgba(255,170,30,.1)}
#ms-stage.t2{border-color:rgba(140,120,255,.6);box-shadow:0 16px 48px rgba(0,0,0,.5),inset 0 0 70px rgba(110,90,255,.14)}
#ms-stage.golden{border-color:var(--gold)}

/* livelier entrances: a light sweep across the stage on a new item, flip-in options, bouncy cards */
#ms-stage::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%);transform:translateX(110%);opacity:0}
#ms-stage.sweep::before{animation:msSweepIn 1s ease-out}
@keyframes msSweepIn{0%{transform:translateX(110%);opacity:1}100%{transform:translateX(-110%);opacity:1}}
.ms-opt.in{animation:msOptFlip .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes msOptFlip{0%{opacity:0;transform:perspective(60vw) rotateX(-80deg) translateY(2vh)}60%{opacity:1;transform:perspective(60vw) rotateX(12deg)}100%{transform:none}}
.ms-card.in{animation:msCardDrop .65s cubic-bezier(.34,1.56,.64,1) both}
@keyframes msCardDrop{0%{opacity:0;transform:translateY(-5vh) scale(.8) rotate(-4deg)}100%{opacity:1;transform:none}}
.ms-prompt.in{animation:msTextIn .7s cubic-bezier(.34,1.56,.64,1)}
/* richer reveal: sparkles around the right answer, a glow ring on the answer box */
.ms-opt.right,.ms-tf-res.yes,.ms-tf-res.no,.ms-answer,.ms-odd .ms-card.odd{position:relative}
.ms-opt.right::before,.ms-opt.right::after,.ms-answer::before,.ms-answer::after{content:'✨';position:absolute;font-size:3.4vh;pointer-events:none;animation:msTwinkle 1.4s ease-in-out infinite}
.ms-opt.right::before,.ms-answer::before{top:-2.2vh;right:-1vw}
.ms-opt.right::after,.ms-answer::after{bottom:-2vh;left:-.8vw;animation-delay:.7s}
@keyframes msTwinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.25) rotate(20deg);opacity:1}}
.ms-answer{animation:msZoom .7s cubic-bezier(.34,1.56,.64,1),msAnsGlow 2s ease-in-out .7s infinite}
@keyframes msAnsGlow{0%,100%{box-shadow:0 10px 44px rgba(0,184,148,.4)}50%{box-shadow:0 10px 60px rgba(0,184,148,.75),0 0 0 .6vh rgba(0,184,148,.25)}}

/* idle title screen: the game logo bobbing over turning light rays, a shimmering title, level chips */
.ms-idle{position:relative}
.ms-idle h1{font-size:7.4vw}
.ms-idle p{font-size:2.6vw}
#ms-item .ms-idle{gap:1.8vh}
.ms-idle-rays{position:absolute;left:50%;top:9vh;width:70vh;height:70vh;margin:-35vh 0 0 -35vh;border-radius:50%;pointer-events:none;background:conic-gradient(from 0deg,rgba(255,215,0,.22),transparent 12deg,rgba(255,215,0,.22) 24deg,transparent 36deg,rgba(255,215,0,.22) 48deg,transparent 60deg,rgba(255,215,0,.22) 72deg,transparent 84deg,rgba(255,215,0,.22) 96deg,transparent 108deg,rgba(255,215,0,.22) 120deg,transparent 132deg,rgba(255,215,0,.22) 144deg,transparent 156deg,rgba(255,215,0,.22) 168deg,transparent 180deg,rgba(255,215,0,.22) 192deg,transparent 204deg,rgba(255,215,0,.22) 216deg,transparent 228deg,rgba(255,215,0,.22) 240deg,transparent 252deg,rgba(255,215,0,.22) 264deg,transparent 276deg,rgba(255,215,0,.22) 288deg,transparent 300deg,rgba(255,215,0,.22) 312deg,transparent 324deg,rgba(255,215,0,.22) 336deg,transparent 348deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:fxRays 24s linear infinite}
.ms-logo{position:relative;height:15vh;width:auto;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(255,200,60,.35));animation:msLogoBob 3.2s ease-in-out infinite}
@keyframes msLogoBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-1.8vh) rotate(2deg)}}
.ms-idle h1{position:relative;background:linear-gradient(110deg,#FFD700 0%,#FFE875 30%,#fff7d6 45%,#FFE875 60%,#ffb300 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;animation:msShimmer 4s linear infinite}
@keyframes msShimmer{0%{background-position:100% 0}100%{background-position:-150% 0}}
.ms-idle-lv{position:relative;display:flex;gap:2vw;justify-content:center}
.ms-idle-lv .lvchip{font-size:2.2vw;font-weight:900;padding:1vh 2vw;color:var(--lv-ink);background:linear-gradient(135deg,var(--lv-a),var(--lv-b));box-shadow:0 0 26px var(--lv-glow)}
.ms-idle-lv .lvchip.lv1{border-radius:99px;animation:lvBounce 2.4s ease-in-out infinite}
.ms-idle-lv .lvchip.lv2{position:relative;overflow:hidden;border-radius:.6vw}

/* individual board: one look per level */
.mb-title img,.fxb-title img{height:1.2em;width:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.mb-h,.fxb-h{position:relative;overflow:hidden;display:flex;align-items:center;gap:.6vw;min-height:4.8vh;padding:0 1vw;border:none;font-size:2.7vh;font-weight:900;color:var(--lv-ink);text-shadow:none;background:linear-gradient(90deg,var(--lv-a),var(--lv-b) 70%,var(--lv-c));box-shadow:0 0 22px var(--lv-glow)}
.mb-h::before,.fxb-h::before{content:'';position:absolute;inset:0;background:var(--lv-art) center/cover;opacity:.28;mix-blend-mode:luminosity}
.mb-h>span,.fxb-h>span{position:relative}
.lv1 .mb-h,.lv1.fxb-lvl .fxb-h{border-radius:99px;--lv-art:url('images/ui/card-l1.webp')}
.lv2 .mb-h,.lv2.fxb-lvl .fxb-h{border-radius:.6vh;--lv-art:url('images/ui/card-l2.webp');clip-path:polygon(0 0,100% 0,98% 100%,2% 100%)}
.fxb-h{justify-content:center;font-size:calc(var(--bk) * 3.4vh);min-height:calc(var(--bk) * 6vh)}
.lv1 .mb-row{border-radius:var(--lv-r);background:linear-gradient(90deg,rgba(40,24,6,.92),rgba(70,40,8,.92));border-color:rgba(255,190,60,.32)}
.lv2 .mb-row{border-radius:var(--lv-r);background:linear-gradient(90deg,rgba(16,14,52,.94),rgba(28,22,80,.94));border-color:rgba(140,120,255,.35);border-right:.45vw solid var(--lv-c)}
.lv1 .mb-rk{display:flex;align-items:center;justify-content:center;height:3.8vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,var(--lv-b));color:var(--lv-ink);font-size:2.3vh}
.lv2 .mb-rk{display:flex;align-items:center;justify-content:center;height:3.4vh;width:3.4vh;margin:0 .2vh;transform:rotate(45deg);border-radius:.4vh;background:linear-gradient(135deg,var(--lv-a),var(--lv-b));box-shadow:0 0 10px var(--lv-glow);font-size:2.1vh;color:#fff}
.lv2 .mb-rk>i{font-style:normal;transform:rotate(-45deg)}
.lv1 .mb-rk.md,.lv2 .mb-rk.md{background:none;box-shadow:none;transform:none;font-size:3.2vh}
.lv2 .mb-rk.md>i{transform:none}
.lv1 .mb-st{color:#ffd166}
.lv2 .mb-st{color:#9ee8ff;text-shadow:0 0 12px rgba(34,211,238,.6)}
.lv1 .mb-row.r1,.lv1 .mb-row.r2,.lv1 .mb-row.r3{background:linear-gradient(90deg,rgba(255,159,28,.28),rgba(255,209,102,.42));border-color:#ffd166;box-shadow:0 0 16px rgba(255,183,3,.35)}
.lv2 .mb-row.r1,.lv2 .mb-row.r2,.lv2 .mb-row.r3{background:linear-gradient(90deg,rgba(109,93,252,.4),rgba(34,211,238,.28));border-color:#a78bfa;box-shadow:0 0 16px rgba(110,90,255,.5)}
.lv1 .mb-row.hit{animation:mbHitSun 1.5s ease-out 3}
.lv2 .mb-row.hit{animation:mbHitNeon 1.5s ease-out 3}
@keyframes mbHitSun{0%{transform:scale(1);background:linear-gradient(90deg,#ff9f1c,#ffd166);border-color:#fff3c4;box-shadow:0 0 30px rgba(255,190,60,.9)}15%{transform:scale(1.06)}30%{transform:scale(.98)}45%{transform:scale(1.03)}55%{transform:scale(1);background:linear-gradient(90deg,#ff9f1c,#ffd166);border-color:#fff3c4;box-shadow:0 0 30px rgba(255,190,60,.9)}100%{transform:scale(1)}}
@keyframes mbHitNeon{0%,55%{background:linear-gradient(90deg,#6d5dfc,#22d3ee);border-color:#e0f7ff;box-shadow:0 0 0 .4vh rgba(34,211,238,.5),0 0 34px rgba(110,90,255,.95)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
.lv1 .mb-row.hit .mb-nm,.lv1 .mb-row.hit .mb-st{color:#3a1d00;text-shadow:none}
.fx-board .fx-dim.solid,.fx-podium-bg{background:linear-gradient(180deg,rgba(8,8,28,.86),rgba(5,5,20,.93)),url('images/ui/bg-leaderboard.webp') center 40%/cover no-repeat}

/* award pop by level */
.fx-award-lv1 .fx-card{border-radius:4vw;border:.7vh solid #ffd166;background:radial-gradient(ellipse at 50% 0%,rgba(255,180,40,.45),transparent 60%),linear-gradient(160deg,#5a2d00,#2a1400);box-shadow:0 0 0 1.2vh rgba(255,209,102,.18),0 0 120px rgba(255,170,30,.8);animation:fxBouncy .9s cubic-bezier(.3,1.7,.5,1)}
@keyframes fxBouncy{0%{opacity:0;transform:scale(.2) rotate(-14deg)}45%{opacity:1;transform:scale(1.14) rotate(4deg)}65%{transform:scale(.94) rotate(-2deg)}82%{transform:scale(1.04)}100%{transform:none}}
.fx-award-lv1 .fx-name{text-shadow:0 .5vh 0 #b34700,0 6px 30px rgba(0,0,0,.6)}
.fx-award-lv2 .fx-card{border-radius:.8vw;border:.4vh solid #a78bfa;background:linear-gradient(160deg,#1b1060,#080a2a 60%,#0b2a4a);box-shadow:0 0 0 .4vh rgba(34,211,238,.55),0 0 50px rgba(110,90,255,.9),0 0 140px rgba(34,211,238,.45),inset 0 0 60px rgba(110,90,255,.35);animation:fxZap .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fxZap{0%{opacity:0;transform:scale(1.6) skewX(-12deg);filter:brightness(3)}30%{opacity:1;filter:brightness(2)}45%{filter:brightness(.6)}60%{filter:brightness(1.6)}100%{transform:none;filter:none}}
.fx-award-lv2 .fx-card{overflow:hidden}
.fx-award-lv2 .fx-card::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(160,240,255,.45) 50%,transparent 65%);animation:lvShine 1.6s ease-in-out .3s infinite}
.fx-award-lv2 .fx-name{color:#fff;text-shadow:0 0 18px #22d3ee,0 0 40px #6d5dfc,0 6px 20px rgba(0,0,0,.6)}
.lv2-shine{position:relative;overflow:hidden}
.mb-rk>i{font-style:normal}
.fx-lvbadge{position:relative;z-index:1;font-size:2.6vw;font-weight:900;padding:.6vh 2vw;color:var(--lv-ink);background:linear-gradient(135deg,var(--lv-a),var(--lv-b));box-shadow:0 0 24px var(--lv-glow)}
.fx-lvbadge.lv1{border-radius:99px}
.fx-lvbadge.lv2{border-radius:.5vw}
.fx-bolt{position:absolute;top:50%;font-size:22vh;line-height:1;filter:drop-shadow(0 0 30px #22d3ee) drop-shadow(0 0 60px #6d5dfc);animation:fxBolt 1.1s steps(1) infinite;pointer-events:none}
.fx-bolt.r{right:6vw;transform:translateY(-50%) rotate(12deg)}
.fx-bolt.l{left:6vw;transform:translateY(-50%) rotate(-12deg) scaleX(-1)}
@keyframes fxBolt{0%{opacity:1}12%{opacity:.15}20%{opacity:1}55%{opacity:.85}62%{opacity:.2}70%{opacity:1}}
.fx-sun{position:absolute;font-size:16vh;line-height:1;pointer-events:none;animation:fxSunSpin 4s linear infinite;filter:drop-shadow(0 0 30px rgba(255,190,60,.9))}
.fx-sun.r{right:8vw;top:18vh}
.fx-sun.l{left:8vw;bottom:16vh;animation-direction:reverse}
@keyframes fxSunSpin{to{transform:rotate(360deg)}}
.fx-award-lv2 .fx-burst{opacity:.35}
.fx-star-img{height:1em;width:auto;vertical-align:-.12em;margin-left:.15em;animation:fxStarSpin .9s cubic-bezier(.34,1.56,.64,1)}
@keyframes fxStarSpin{0%{transform:rotate(-200deg) scale(.3)}100%{transform:none}}

/* podium: each kid's card shows the level */
.fx-step .lvtag{font-size:1.9vw;font-weight:900;padding:.3vh 1.2vw;color:var(--lv-ink);background:linear-gradient(135deg,var(--lv-a),var(--lv-b));box-shadow:0 0 18px var(--lv-glow)}
.fx-step .lvtag.lv1{border-radius:99px}
.fx-step .lvtag.lv2{border-radius:.4vw}
.fx-col:has(.fx-podium) .fx-title{font-size:4.4vw}
.fx-col:has(.fx-podium){gap:1.6vh}
.fx-step .nm{font-size:3vw}
.fx-step.s1 .nm{font-size:3.6vw}
.fx-step.lv1 .nm{color:#ffe08a;text-shadow:0 .4vh 0 #a34400,0 0 30px rgba(255,170,30,.6)}
.fx-step.lv2 .nm{color:#e9e3ff;text-shadow:0 0 16px #6d5dfc,0 0 30px rgba(34,211,238,.6)}

/* ═════════════════ CONTROL WINDOW (Task 8) ═════════════════ */
#mc-root{min-height:100vh;font-size:15px;line-height:1.5;background:linear-gradient(180deg,#0d1233,#070a1c);padding-bottom:24px}
#mc-root small{font-size:.8em;color:var(--muted);font-weight:600}
.mc-card{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.mc-card h3{font-size:16px;font-weight:900;margin-bottom:8px;color:var(--gold-light)}
.mc-center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.mc-gate{max-width:560px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px}
.mc-gate h2{font-size:24px;font-weight:900}
.mc-big-ico{font-size:56px;line-height:1}
.mc-sub{color:var(--muted);font-weight:700}
.mc-muted{color:var(--muted);font-size:13px;font-weight:600}
.mc-lbl{font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.mc-lbl.ok{color:var(--correct)}
.mc-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.mc-row.center{justify-content:center}
.mc-sep{width:1px;align-self:stretch;background:var(--border2);margin:0 4px}
/* buttons and chips */
.mc-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--border2);background:#232a55;color:#fff;font-size:14px;font-weight:800;text-decoration:none;transition:transform .08s,background .15s}
.mc-btn:hover:not(:disabled){background:#2e3770}
.mc-btn:active:not(:disabled){transform:scale(.96)}
.mc-btn:disabled{opacity:.4;cursor:default}
.mc-btn.pri{background:var(--accent);border-color:#8d80f0}
.mc-btn.go{background:var(--correct);border-color:#3fe0b9;color:#04261d}
.mc-btn.go:hover:not(:disabled){background:#1fd1aa}
.mc-btn.gold{background:linear-gradient(135deg,#FFE875,#D4A017);color:#2a1c00;border-color:#fff3b0}
.mc-btn.danger{background:#5a1f2b;border-color:var(--wrong);color:#ffd5d5}
.mc-btn.danger.on{background:var(--wrong);color:#fff}
.mc-btn.ghost{background:transparent}
.mc-btn.big{font-size:18px;padding:11px 22px}
.mc-btn.sm{font-size:12px;padding:4px 10px}
.mc-btn.wide{width:100%}
.mc-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mc-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--border2);background:rgba(255,255,255,.05);color:#fff;font-size:14px;font-weight:700}
.mc-chips.sm .mc-chip{font-size:13px;padding:4px 10px}
.mc-chip.on{background:var(--accent);border-color:#a79cf5}
.mc-chip:disabled{opacity:.35;cursor:default}
.mc-chip.team{border-color:var(--tc);border-width:2px}
.mc-chip.team.on{background:var(--tc)}
.mc-chip.bad{background:rgba(255,107,107,.18);border-color:var(--wrong)}
.mc-chip .dot,.mc-kid .dot{width:10px;height:10px;border-radius:50%;background:var(--tc,rgba(255,255,255,.25));flex-shrink:0}
.mc-chk{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:#fff;font-size:14px;font-weight:700}
.mc-chk .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--border2);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.mc-chk.on .box{background:var(--correct);border-color:var(--correct);color:#04261d}
.mc-x{border:none;background:none;color:var(--muted);font-size:16px;margin-inline-start:auto;padding:0 4px}
.mc-x:hover{color:#fff}
.mc-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--tc,var(--border2));font-size:13px;font-weight:800}
.mc-badge.gold{background:linear-gradient(135deg,#FFE875,#D4A017);color:#2a1c00;border-color:#fff3b0}
.mc-warn{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(255,107,107,.12);border:1px solid var(--wrong);font-weight:700}
.mc-warn.sm{font-size:13px;margin-top:4px;padding:6px 8px}
.mc-msg{color:var(--wrong);font-weight:800}
.mc-note{color:var(--gold-light);font-weight:700;font-size:13px}
/* header */
.mc-bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 14px;background:rgba(10,14,39,.96);border-bottom:1px solid var(--border2);backdrop-filter:blur(6px)}
.mc-brand{display:flex;align-items:center;gap:8px}
.mc-brand .ico{font-size:26px}
.mc-brand b{display:block;font-size:16px;font-weight:900}
.mc-brand small{display:block}
.mc-syncbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;min-width:200px}
.mc-syncbox.center{justify-content:center}
.mc-bar .mc-syncbox:has(.err){order:3;flex-basis:100%}
.mc-sync{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:800}
.mc-sync.ok{background:rgba(0,184,148,.15);color:#7ff0d3}
.mc-sync.wait{background:rgba(255,215,0,.15);color:var(--gold-light)}
.mc-sync.wait.busy{animation:mcPulse 1.2s ease-in-out infinite}
.mc-sync.err{background:rgba(255,107,107,.18);color:#ffb3b3}
.mc-sync-note{font-size:12px;color:var(--muted);font-weight:700}
@keyframes mcPulse{50%{opacity:.55}}
.mc-bar-btns{display:flex;flex-wrap:wrap;gap:6px}
/* setup */
.mc-setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 14px;max-width:1300px;margin:0 auto}
.mc-setup .wide{grid-column:1/-1}
.mc-form{display:flex;flex-wrap:wrap;gap:12px}
.mc-form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800;color:var(--muted);flex:1;min-width:160px}
.mc-form input,.mc-search input,.mc-tsearch{font-family:inherit;font-size:15px;font-weight:700;padding:8px 12px;border-radius:10px;border:1px solid var(--border2);background:#0f1433;color:#fff;width:100%}
.mc-form input:focus,.mc-search input:focus,.mc-tsearch:focus{outline:2px solid var(--accent);border-color:transparent}
.mc-subj{padding:8px 0;border-bottom:1px solid var(--border)}
.mc-subj:last-child{border-bottom:0}
.mc-subj .mc-chips{margin-top:6px;padding-inline-start:26px}
.mc-ted-add{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.mc-tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.mc-tcard{border:1px solid var(--border2);border-top:5px solid var(--tc);border-radius:12px;padding:10px;background:rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px}
.mc-tcard-h{display:flex;align-items:center;gap:8px}
.mc-tcard-h .ico{font-size:20px}
.mc-kids{display:flex;flex-wrap:wrap;gap:5px}
.mc-kchip button{border:1px solid var(--border2);background:rgba(255,255,255,.06);color:#fff;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700}
.mc-kchip.open button{background:var(--accent)}
.mc-move{display:flex;flex-wrap:wrap;gap:4px;align-items:center;width:100%;font-size:12px;font-weight:800;color:var(--muted);padding:4px 0}
.mc-tdot{border:2px solid var(--tc,var(--border2));background:rgba(255,255,255,.06);color:#fff;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:800}
.mc-tdot.danger{border-color:var(--wrong);color:#ffb3b3}
.mc-check{display:flex;flex-wrap:wrap;gap:4px;align-items:center;max-height:180px;overflow:auto}
.mc-tres{display:flex;flex-direction:column;gap:4px}
.mc-foot{position:sticky;bottom:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px;padding:10px 14px;background:rgba(10,14,39,.96);border-top:1px solid var(--border2)}
.mc-foot .mc-msg,.mc-foot .mc-note{margin-inline-end:auto}
.mc-foot .go{font-size:18px;padding:10px 28px}
/* play */
.mc-strip{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px}
.mc-strip:empty{display:none}
.mc-strip.end{justify-content:center;padding:10px 0}
.mc-steam{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--border2);border-inline-start:6px solid var(--tc)}
.mc-steam.lead{border-color:var(--gold);border-inline-start-color:var(--tc)}
.mc-steam .nm{font-weight:800;font-size:14px}
.mc-steam b{font-size:18px;color:var(--gold)}
.mc-play{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,1fr);gap:12px;padding:0 14px;align-items:start}
.mc-qcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mc-trow{display:flex;align-items:center;gap:10px;padding:4px 0}
.mc-trow .mc-lbl{width:72px;flex-shrink:0}
.mc-next{margin-top:6px}
.mc-next .big{flex:1}
.mc-surp{border-top:1px solid var(--border);padding-top:8px}
.mc-empty{text-align:center;padding:30px;color:var(--muted);font-weight:700}
.mc-itemcard{display:flex;flex-direction:column;gap:10px;border-width:2px}
.mc-itemcard.prev{border-color:#8d80f0}
.mc-itemcard.shown{border-color:var(--teal)}
.mc-itemcard.rev{border-color:var(--correct)}
.mc-itemcard.golden{box-shadow:0 0 0 2px var(--gold),0 0 30px rgba(255,215,0,.25)}
.mc-ihead{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mc-stage{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:900}
.mc-stage.prev{background:rgba(108,92,231,.3)}
.mc-stage.shown{background:rgba(0,206,201,.25)}
.mc-stage.rev{background:rgba(0,184,148,.3)}
.mc-timer{margin-inline-start:auto;font-size:20px;font-weight:900;color:var(--gold)}
.mc-timer.urgent{color:var(--wrong)}
.mc-ibody{display:flex;flex-direction:column;gap:8px}
.mc-prompt{font-size:21px;font-weight:900;line-height:1.5}
.mc-emoji{font-size:44px;line-height:1.3;letter-spacing:.05em}
.mc-scr{font-size:30px;font-weight:900;letter-spacing:.1em;color:var(--gold-light)}
.mc-opts,.mc-clues,.mc-steps{list-style:none;display:flex;flex-direction:column;gap:5px}
.mc-opts li,.mc-clues li,.mc-steps li{padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-weight:700;opacity:.7}
.mc-opts li.on,.mc-clues li.on{opacity:1;border-color:var(--teal)}
.mc-opts li.ok{background:rgba(0,184,148,.16);border-color:var(--correct);opacity:1}
.mc-opts .l{display:inline-block;min-width:26px;font-weight:900;color:var(--gold-light)}
.mc-clues{counter-reset:c}
.mc-clues li::before{counter-increment:c;content:counter(c) '. ';font-weight:900;color:var(--gold-light)}
.mc-steps{counter-reset:s}
.mc-steps li{opacity:1}
.mc-steps li::before{counter-increment:s;content:counter(s) '. ';font-weight:900;color:var(--muted)}
.mc-steps.ok li{border-color:rgba(0,184,148,.5)}
.mc-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc-secret{font-size:34px;font-weight:900;text-align:center;padding:14px;border-radius:12px;background:rgba(255,215,0,.1);border:2px dashed var(--gold);color:var(--gold-light)}
.mc-ans,.mc-explain{padding:8px 12px;border-radius:10px;font-weight:700}
.mc-ans{background:rgba(0,184,148,.15);border:1px solid var(--correct);font-size:17px;font-weight:900}
.mc-explain{background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.35)}
.mc-ans span,.mc-explain span{display:block;font-size:12px;font-weight:900;color:var(--muted)}
.mc-iacts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:6px;border-top:1px solid var(--border)}
.mc-iacts .ghost{margin-inline-start:auto}
.mc-tctl,.mc-counter{display:inline-flex;align-items:center;gap:6px}
.mc-counter b{font-size:24px;min-width:40px;text-align:center;color:var(--gold)}
.mc-imeta{font-size:11px;color:var(--muted);direction:ltr;text-align:left}
.mc-note-card{display:flex;align-items:center;gap:8px;font-weight:800;border-color:var(--gold)}
.mc-bet{display:flex;flex-direction:column;gap:6px;border-color:var(--gold)}
/* award panel */
.mc-aw{position:sticky;top:64px;max-height:calc(100vh - 76px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.mc-pts{display:flex;align-items:baseline;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.35)}
.mc-pts b{font-size:26px;color:var(--gold)}
.mc-pts.neg{background:rgba(255,107,107,.12);border-color:var(--wrong)}
.mc-pts.neg b{color:var(--wrong)}
.mc-pts span{font-size:13px;font-weight:800;color:var(--muted)}
.mc-last{font-size:13px;color:var(--muted);font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-pickcard{margin-top:8px;padding:10px;border-radius:12px;border:2px solid var(--gold);background:rgba(255,215,0,.06);display:flex;flex-direction:column;gap:6px}
.mc-pickcard b{font-size:18px}
.mc-search{display:flex;flex-direction:column;gap:6px}
.mc-search input{font-size:17px;padding:10px 12px}
#mc-res{display:flex;flex-direction:column;gap:5px}
#mc-res:empty{display:none}
.mc-res{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--border2);background:#1f2650;color:#fff;font-size:15px;text-align:right}
.mc-res:hover:not(:disabled){background:#2a3268;border-color:var(--correct)}
.mc-res:disabled{opacity:.5}
.mc-res.sm{font-size:13px;padding:5px 8px}
.mc-res .lv{padding:0 6px;border-radius:6px;background:rgba(255,255,255,.1);color:#fff}
.mc-res .pts{margin-inline-start:auto;font-weight:900;color:var(--correct);font-size:16px}
.mc-res .pts.neg{color:var(--wrong)}
.mc-tag{padding:0 8px;border-radius:99px;background:var(--tc);font-size:12px;font-weight:800}
.mc-tbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:4px}
.mc-tbtn{display:flex;align-items:center;justify-content:center;gap:5px;padding:8px;border-radius:10px;border:2px solid var(--tc);background:rgba(0,0,0,.25);color:#fff;font-size:14px;font-weight:800}
.mc-tbtn:hover{background:var(--tc)}
.mc-tbtn b{color:var(--gold-light)}
.mc-rgroup{display:flex;flex-direction:column;gap:5px}
/* fixed columns and a fixed-width stars slot: a chip never moves or resizes when its stars change */
.mc-kidgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:5px}
.mc-kidgrid>.mc-muted{grid-column:1/-1}
.mc-kid{display:grid;grid-template-columns:10px minmax(0,1fr) 3.2em;align-items:center;gap:6px;min-height:42px;padding:4px 10px;border-radius:12px;border:1px solid var(--border2);background:#1f2650;color:#fff;font-size:14px;font-weight:700;text-align:right}
.mc-kid:hover{border-color:var(--correct);background:#2a3268}
.mc-kid .nm{line-height:1.25;overflow-wrap:anywhere}
.mc-kid b{color:var(--gold);font-size:13px;text-align:left;font-variant-numeric:tabular-nums}
.mc-failed{padding:8px 10px;border-radius:10px;background:rgba(255,107,107,.1);border:1px solid var(--wrong);font-size:13px}
.mc-failed ul{padding-inline-start:18px;margin-top:4px}
/* modal */
.mc-modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(3,5,15,.8);padding:24px;overflow:auto}
.mc-modal.on{display:block}
.mc-modal-box{max-width:1200px;margin:0 auto;background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:14px}
.mc-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
/* end */
.mc-endwrap{max-width:900px;margin:20px auto;padding:0 14px}
#mc-end{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px}
#mc-end h2{font-size:26px;font-weight:900}
.mc-podium{list-style:none;font-size:22px;font-weight:900;display:flex;flex-direction:column;gap:6px}
.mc-podium b{color:var(--gold)}
#mc-toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,30px);z-index:99;max-width:90vw;padding:10px 20px;border-radius:12px;background:#111733;border:1px solid var(--gold);color:#fff;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#mc-toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:1000px){
  .mc-play,.mc-setup{grid-template-columns:minmax(0,1fr)}
  .mc-aw{position:static;max-height:none}
  .mc-two{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- Audience (projector) window -->
<div id="ms-root">
  <div id="ms-bg"></div>
  <canvas id="ms-sky"></canvas>
  <div class="ms-lights"></div>
  <div id="ms">
    <div id="ms-top">
      <div id="ms-tags"></div>
      <button id="ms-fs" type="button">⛶ ملء الشاشة</button>
      <div id="ms-ring">
        <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" cx="50" cy="50" r="45" stroke-dasharray="282.74" stroke-dashoffset="0"/></svg>
        <div class="num"></div>
      </div>
    </div>
    <div id="ms-stage"><div id="ms-item"></div></div>
    <div id="ms-teams"></div>
    <aside id="ms-board">
      <div class="mb-title"><img src="images/ui/ic-trophy.webp" alt=""><span class="g">أوائل مسابقة النهارده</span></div>
      <div id="mb-secs"></div>
    </aside>
  </div>
  <div id="ms-fx"></div>
  <canvas id="ms-confetti"></canvas>
</div>

<!-- Control window (laptop) -->
<div id="mc-root"></div>

<script>
/* Each window loads only what it needs. The projector gets the pure core (segment labels) and its
   renderer: no question bank, lesson data, Firestore layer or SDK, so no answer ever sits in that page.
   async=false keeps execution in list order while the files download in parallel. */
var MT_SCRIPTS = MT_VIEW === 'screen'
  ? ['meeting-core.js', 'meeting-screen.js']
  : ['https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js',
     'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js',
     'level1-bible-data.js', 'level1-service-data.js', 'level2-life-data.js', 'level2-bible-data.js',
     'level1.js', 'compete-bank.js', 'meeting-bank.js', 'meeting-core.js', 'meeting-cloud.js',
     'meeting-control.js'];

function mtStart() {
  if (MT_VIEW === 'screen') {
    /* The projector window never touches Firestore and needs no admin session. */
    msBoot();
    return;
  }
  firebase.initializeApp({
    apiKey:"AIzaSyDZXv7nmtJ5tqSLmvrxQ1F4WuoHmBxttuY",
    authDomain:"min-el-batal.firebaseapp.com",
    projectId:"min-el-batal",
    storageBucket:"min-el-batal.firebasestorage.app",
    messagingSenderId:"743794480493",
    appId:"1:743794480493:web:74c8ef6a444e29f7a4b664"
  });
  window.db = firebase.firestore();
  var emuPort = new URLSearchParams(location.search).get('emu');
  if (emuPort) db.useEmulator('localhost', +emuPort);
  else db.settings({ experimentalForceLongPolling: true, experimentalAutoDetectLongPolling: false, merge: true });
  mcBoot();
}

(function () {
  var failed = false;
  MT_SCRIPTS.forEach(function (src, i) {
    var s = document.createElement('script');
    s.src = src;
    s.async = false;
    s.onerror = function () {
      if (failed) return;
      failed = true;
      document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;inset:auto 0 0 0;z-index:99999;padding:12px;background:#b91c1c;color:#fff;font:700 18px Cairo,sans-serif;text-align:center">مقدرناش نحمّل الصفحة كلها، اتأكد من النت واعمل ريفرش</div>');
    };
    if (i === MT_SCRIPTS.length - 1) s.onload = function () { if (!failed) mtStart(); };
    document.body.appendChild(s);
  });
})();
</script>
</body>
</html>
