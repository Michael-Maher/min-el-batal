<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كأس مين البطل 🏆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
    --bg: #0a0e27;
    --bg2: #141937;
    --card: #1a2040;
    --border: rgba(255,255,255,0.08);
    --gold: #FFD700;
    --silver: #C0C0C0;
    --bronze: #CD7F32;
    --team-a: #6C5CE7;
    --team-b: #00CEC9;
    --correct: #00B894;
    --wrong: #FF6B6B;
    --text: #fff;
    --muted: rgba(255,255,255,0.5);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
}

/* ============ ADMIN SIDEBAR ============ */
.admin-sidebar {
    position: fixed;
    top: 0; right: 0;
    width: 380px;
    height: 100vh;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    z-index: 1000;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto;
    padding: 20px;
    direction: rtl;
}
.admin-sidebar.open { transform: translateX(0); }
.admin-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 1001;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(108, 92, 231, 0.3);
    border: 2px solid var(--team-a);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    backdrop-filter: blur(8px);
}
.admin-toggle:hover { background: var(--team-a); transform: scale(1.1); }
.admin-toggle.active { background: var(--team-a); right: 396px; }
.admin-section { margin-bottom: 20px; }
.admin-section h3 {
    font-size: 16px;
    color: var(--gold);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.admin-btn {
    display: block;
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-family: 'Cairo';
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 8px;
    transition: all 0.2s;
    text-align: center;
}
.admin-btn:hover { background: rgba(108, 92, 231, 0.2); border-color: var(--team-a); }
.admin-btn.primary { background: var(--team-a); border-color: var(--team-a); }
.admin-btn.primary:hover { background: #5a4bd1; }
.admin-btn.danger { background: rgba(255,107,107,0.15); border-color: var(--wrong); color: var(--wrong); }
.admin-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-family: 'Cairo';
    font-size: 13px;
    margin-bottom: 8px;
    outline: none;
}
.admin-input:focus { border-color: var(--team-a); }
.admin-input::placeholder { color: var(--muted); }
select.admin-input { appearance: none; cursor: pointer; }

/* Team list in admin */
.admin-team-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    margin-bottom: 6px;
    border: 1px solid var(--border);
}
.admin-team-item img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--border);
}
.admin-team-item .team-name { flex: 1; font-weight: 700; font-size: 13px; }
.admin-team-item button {
    background: none;
    border: none;
    color: var(--wrong);
    cursor: pointer;
    font-size: 14px;
    padding: 4px;
}

/* Subject/Lesson picker */
.admin-subject-check {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    font-size: 13px;
}
.admin-subject-check input { accent-color: var(--team-a); }
.admin-lesson-list { padding-right: 24px; }
.admin-lesson-check {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 0;
    font-size: 12px;
    color: var(--muted);
}
.admin-lesson-check input { accent-color: var(--team-b); }

/* ============ MAIN VIEWS ============ */
.view { display: none; width: 100vw; height: 100vh; }
.view.active { display: flex; }

/* ============ BRACKET VIEW ============ */
.bracket-view {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #141937 0%, #0a0e27 100%);
    position: relative;
    overflow: hidden;
}
.bracket-title {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 36px;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
    white-space: nowrap;
    z-index: 5;
}
.bracket-title i { margin-left: 12px; }

.bracket-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    height: 80vh;
    width: 95vw;
    position: relative;
}

/* Each round column */
.bracket-round {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    min-width: 180px;
    position: relative;
    z-index: 2;
}
.round-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    text-align: center;
}

/* Match card */
.match-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0;
    width: 170px;
    margin: 8px 0;
    overflow: hidden;
    transition: all 0.4s ease;
    cursor: pointer;
    position: relative;
}
.match-card:hover { border-color: var(--team-a); transform: scale(1.04); box-shadow: 0 0 20px rgba(108,92,231,0.3); }
.match-card.active-match {
    border-color: var(--gold) !important;
    box-shadow: 0 0 30px rgba(255,215,0,0.3);
    animation: matchPulse 2s infinite;
}
.match-card.paused-match {
    border-color: var(--gold) !important;
    box-shadow: 0 0 15px rgba(255,215,0,0.2);
    cursor: pointer;
    position: relative;
}
.match-card.paused-match::after {
    content: '⏸ متوقف — اضغط للاستكمال';
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--gold);
    white-space: nowrap;
    font-weight: 700;
    font-family: 'Cairo';
}
@keyframes matchPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.2); }
    50% { box-shadow: 0 0 40px rgba(255,215,0,0.4); }
}
.match-team {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    position: relative;
    transition: background 0.3s;
}
.match-team:first-child { border-bottom: 1px solid var(--border); }
.match-team.winner { background: rgba(0,184,148,0.12); }
.match-team.loser { opacity: 0.4; }
.match-team-img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,0.15);
    flex-shrink: 0;
}
.match-team-name {
    flex: 1;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.match-team-score {
    font-size: 16px;
    font-weight: 900;
    min-width: 24px;
    text-align: center;
    color: var(--gold);
}
.match-team-empty {
    padding: 10px 12px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.match-team-empty:first-child { border-bottom: 1px solid var(--border); }
.match-vs {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg);
    border: 2px solid var(--border);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 900;
    color: var(--gold);
    z-index: 3;
}

/* SVG connector lines */
.bracket-lines {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
}
.bracket-lines line {
    stroke: rgba(255,255,255,0.08);
    stroke-width: 2;
}
.bracket-lines line.active-line {
    stroke: var(--gold);
    stroke-width: 2;
    filter: drop-shadow(0 0 4px rgba(255,215,0,0.3));
}

/* Trophy in center for final */
.bracket-trophy {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 120px;
}
.bracket-trophy-icon {
    font-size: 64px;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(255,215,0,0.5);
    animation: trophyFloat 3s ease-in-out infinite;
}
@keyframes trophyFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
.bracket-trophy-label {
    font-size: 14px;
    color: var(--gold);
    font-weight: 800;
    margin-top: 8px;
}

/* ============ MATCH VIEW (GAMEPLAY) ============ */
.match-view {
    flex-direction: column;
    background: radial-gradient(ellipse at center, #141937 0%, #0a0e27 100%);
    position: relative;
}

/* Scoreboard */
.scoreboard {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 20px 40px;
    width: 100%;
}
.scoreboard-team {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 1;
    padding: 16px 24px;
    border-radius: 16px;
    transition: all 0.3s;
}
.scoreboard-team.team-a { background: rgba(108,92,231,0.12); border: 2px solid rgba(108,92,231,0.3); justify-content: flex-end; }
.scoreboard-team.team-b { background: rgba(0,206,201,0.12); border: 2px solid rgba(0,206,201,0.3); flex-direction: row-reverse; justify-content: flex-end; }
.scoreboard-team.active-turn { border-color: var(--gold); box-shadow: 0 0 30px rgba(255,215,0,0.2); animation: turnPulse 1.5s infinite; }
@keyframes turnPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.2); }
    50% { box-shadow: 0 0 40px rgba(255,215,0,0.4); }
}
.scoreboard-img {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,0.2);
}
.scoreboard-info { text-align: center; }
.scoreboard-info h3 { font-size: 22px; font-weight: 800; margin-bottom: 2px; }
.scoreboard-members {
    font-size: 11px;
    color: var(--muted);
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.scoreboard-score {
    font-size: 48px;
    font-weight: 900;
    min-width: 80px;
    text-align: center;
    transition: all 0.3s;
}
.scoreboard-score.score-bump {
    animation: scoreBump 0.4s ease;
}
@keyframes scoreBump {
    0% { transform: scale(1); }
    40% { transform: scale(1.4); text-shadow: 0 0 20px currentColor; }
    100% { transform: scale(1); }
}
.scoreboard-team.team-a .scoreboard-score { color: var(--team-a); }
.scoreboard-team.team-b .scoreboard-score { color: var(--team-b); }

.scoreboard-vs {
    font-size: 28px;
    font-weight: 900;
    color: var(--gold);
    padding: 0 24px;
    text-shadow: 0 0 20px rgba(255,215,0,0.3);
}

/* Turn indicator */
.turn-indicator {
    text-align: center;
    padding: 8px;
    font-size: 18px;
    font-weight: 800;
    color: var(--gold);
    animation: turnGlow 1.5s ease-in-out infinite;
}
@keyframes turnGlow {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; text-shadow: 0 0 20px rgba(255,215,0,0.5); }
}

/* Question area */
.question-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 60px;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
}
.question-counter {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 8px;
}
.question-type-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 16px;
    background: rgba(108,92,231,0.15);
    color: var(--team-a);
}
.question-text {
    font-size: 32px;
    font-weight: 800;
    text-align: center;
    line-height: 1.6;
    margin-bottom: 32px;
    max-width: 800px;
}

/* Timer */
.match-timer {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 4px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 900;
    margin-bottom: 16px;
    position: relative;
}
.match-timer.warning { border-color: var(--wrong); color: var(--wrong); animation: timerShake 0.3s infinite; }
@keyframes timerShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
}
.timer-circle {
    position: absolute;
    inset: -4px;
}
.timer-circle circle {
    fill: none;
    stroke-width: 4;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: center;
}
.timer-circle .timer-bg { stroke: var(--border); }
.timer-circle .timer-fill { stroke: var(--team-a); transition: stroke-dashoffset 0.1s linear; }
.timer-circle .timer-fill.warning { stroke: var(--wrong); }

/* Options grid */
.options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
    max-width: 800px;
}
.option-btn {
    padding: 20px 24px;
    border-radius: 16px;
    border: 2px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: #fff;
    font-family: 'Cairo';
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 70px;
}
.option-btn:hover { border-color: var(--team-a); background: rgba(108,92,231,0.1); transform: scale(1.02); }
.option-btn:active { transform: scale(0.98); }
.option-btn .option-shape {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
    flex-shrink: 0;
}
.option-btn:nth-child(1) .option-shape { background: rgba(255,107,107,0.2); color: #FF6B6B; }
.option-btn:nth-child(2) .option-shape { background: rgba(108,92,231,0.2); color: #6C5CE7; }
.option-btn:nth-child(3) .option-shape { background: rgba(0,206,201,0.2); color: #00CEC9; }
.option-btn:nth-child(4) .option-shape { background: rgba(253,203,110,0.2); color: #FDCB6E; }
.option-btn.correct { background: rgba(0,184,148,0.2) !important; border-color: var(--correct) !important; }
.option-btn.wrong { background: rgba(255,107,107,0.2) !important; border-color: var(--wrong) !important; }
.option-btn.disabled { pointer-events: none; opacity: 0.6; }

/* True/False buttons */
.tf-grid {
    display: flex;
    gap: 24px;
    width: 100%;
    max-width: 600px;
    justify-content: center;
}
.tf-btn {
    flex: 1;
    padding: 30px;
    border-radius: 20px;
    border: 3px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: #fff;
    font-family: 'Cairo';
    font-size: 28px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
}
.tf-btn.tf-true:hover { border-color: var(--correct); background: rgba(0,184,148,0.1); }
.tf-btn.tf-false:hover { border-color: var(--wrong); background: rgba(255,107,107,0.1); }
.tf-btn.correct { background: rgba(0,184,148,0.25) !important; border-color: var(--correct) !important; }
.tf-btn.wrong { background: rgba(255,107,107,0.25) !important; border-color: var(--wrong) !important; }

/* Fill blank */
.fill-blank-text {
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    line-height: 2;
    margin-bottom: 24px;
}
.fill-blank-text .blank {
    display: inline-block;
    min-width: 120px;
    border-bottom: 3px dashed var(--team-a);
    padding: 0 8px;
    color: var(--team-a);
}

/* Answer feedback overlay */
.answer-feedback {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    animation: feedbackIn 0.3s ease;
    pointer-events: none;
}
@keyframes feedbackIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
.feedback-icon {
    font-size: 120px;
    text-shadow: 0 0 60px rgba(0,0,0,0.5);
}
.feedback-correct .feedback-icon { color: var(--correct); }
.feedback-wrong .feedback-icon { color: var(--wrong); }
.feedback-text {
    font-size: 28px;
    font-weight: 800;
    margin-top: 8px;
}

/* ============ WINNER CELEBRATION ============ */
.winner-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 800;
    animation: fadeIn 0.5s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.winner-trophy {
    font-size: 100px;
    animation: trophyBounce 1s ease infinite;
    margin-bottom: 16px;
}
@keyframes trophyBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.1); }
}
.winner-text {
    font-size: 40px;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(255,215,0,0.4);
    margin-bottom: 8px;
}
.winner-team-name {
    font-size: 52px;
    font-weight: 900;
    margin-bottom: 12px;
}
.winner-team-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--gold);
    box-shadow: 0 0 40px rgba(255,215,0,0.3);
    margin-bottom: 20px;
}
.winner-score {
    font-size: 24px;
    color: var(--muted);
    margin-bottom: 24px;
}

/* Confetti */
.confetti-piece {
    position: fixed;
    z-index: 900;
    font-size: 14px;
    animation: confettiFall 3s ease forwards;
    pointer-events: none;
}
@keyframes confettiFall {
    0% { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}

/* ============ SETUP VIEW ============ */
.setup-view {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #141937 0%, #0a0e27 100%);
}
.setup-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    max-width: 500px;
    width: 90%;
    text-align: center;
}
.setup-logo {
    width: 140px;
    height: 140px;
    object-fit: contain;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 30px rgba(255,215,0,0.4));
    animation: setupLogoFloat 3s ease-in-out infinite;
}
@keyframes setupLogoFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-8px) rotate(-2deg); }
    75% { transform: translateY(-4px) rotate(2deg); }
}
.bracket-logo {
    width: 40px;
    height: 40px;
    object-fit: contain;
    vertical-align: middle;
    margin-left: 8px;
    filter: drop-shadow(0 0 8px rgba(255,215,0,0.5));
}
.setup-card h2 {
    font-size: 32px;
    font-weight: 900;
    color: var(--gold);
    margin-bottom: 8px;
}
.setup-card p {
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 15px;
}

/* Background particles */
.bg-particle {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(108,92,231,0.3);
    animation: bgFloat 20s linear infinite;
    pointer-events: none;
}
@keyframes bgFloat {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-20px) translateX(50px); opacity: 0; }
}

/* Keyboard hint */
.keyboard-hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 100;
    opacity: 0.4;
    transition: opacity 0.3s;
}
.keyboard-hint:hover { opacity: 1; }
.key-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
}
.key-hint kbd {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 10px;
    font-family: monospace;
}

/* Fullscreen button */
.fullscreen-btn {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 1001;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
}
.fullscreen-btn:hover { background: rgba(255,255,255,0.1); }

/* Waiting screen */
.waiting-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 600;
}
.waiting-text {
    font-size: 32px;
    font-weight: 800;
    color: var(--gold);
    animation: turnGlow 1.5s infinite;
}
.waiting-sub { color: var(--muted); font-size: 16px; margin-top: 8px; }

/* ============ PAUSE OVERLAY ============ */
.pause-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 700;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
.pause-icon {
    font-size: 80px;
    color: var(--gold);
    animation: pausePulse 2s ease-in-out infinite;
    margin-bottom: 16px;
}
@keyframes pausePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.95); }
}
.pause-text {
    font-size: 36px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 8px;
}
.pause-sub {
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 24px;
}
.pause-resume-btn {
    background: linear-gradient(135deg, var(--team-a), var(--team-b));
    border: none;
    color: #fff;
    font-family: 'Cairo';
    font-size: 22px;
    font-weight: 800;
    padding: 16px 48px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.3s;
}
.pause-resume-btn:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(108,92,231,0.4); }

/* ============ REVEAL MODE ============ */
/* Options hidden until admin reveals */
.options-hidden .option-btn,
.options-hidden .tf-btn {
    background: rgba(255,255,255,0.03) !important;
    border-color: var(--border) !important;
    color: transparent !important;
    position: relative;
    cursor: default;
    pointer-events: none;
}
.options-hidden .option-btn::after,
.options-hidden .tf-btn::after {
    content: '؟';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 28px;
    font-weight: 900;
}
.options-hidden .option-btn .option-shape { visibility: hidden; }

/* Reveal button (shown on screen for admin) */
.reveal-btn {
    display: block;
    margin: 20px auto 0;
    background: linear-gradient(135deg, #FFD700, #FFA502);
    border: none;
    color: #000;
    font-family: 'Cairo';
    font-size: 22px;
    font-weight: 900;
    padding: 16px 48px;
    border-radius: 16px;
    cursor: pointer;
    animation: revealPulse 1.5s ease-in-out infinite;
    transition: all 0.3s;
}
@keyframes revealPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
    50% { box-shadow: 0 0 40px rgba(255,215,0,0.6); }
}
.reveal-btn:hover { transform: scale(1.05); }

/* Revealed animation */
.options-revealing .option-btn,
.options-revealing .tf-btn {
    animation: optionReveal 0.5s ease both;
}
.options-revealing .option-btn:nth-child(1) { animation-delay: 0s; }
.options-revealing .option-btn:nth-child(2) { animation-delay: 0.1s; }
.options-revealing .option-btn:nth-child(3) { animation-delay: 0.2s; }
.options-revealing .option-btn:nth-child(4) { animation-delay: 0.3s; }
@keyframes optionReveal {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* ============ EXTRA ANIMATIONS ============ */
/* Match intro overlay */
.match-intro {
    position: fixed;
    inset: 0;

}
@keyframes introVsPulse {
    from { transform: scale(0.9); opacity: 0.7; }
    to { transform: scale(1.1); opacity: 1; }
}
.match-intro-team {
    display: flex;
    align-items: center;
    gap: 16px;
    animation: introTeamSlide 0.6s ease-out both;
}
.match-intro-team:first-child { animation-name: introTeamSlideRight; }
.match-intro-team:last-child { animation-name: introTeamSlideLeft; animation-delay: 0.2s; }
@keyframes introTeamSlideRight {
    from { transform: translateX(100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
@keyframes introTeamSlideLeft {
    from { transform: translateX(-100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
.match-intro-team img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid var(--gold);
}
.match-intro-team h2 {
    font-size: 32px;
    font-weight: 900;
}
.match-intro-team:first-child h2 { color: var(--team-a); }
.match-intro-team:last-child h2 { color: var(--team-b); }
.match-intro-members {
    font-size: 13px;
    color: var(--muted);
    max-width: 300px;
}

/* Stadium light beams behind scoreboard */
.stadium-lights {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}
.stadium-lights::before,
.stadium-lights::after {
    content: '';
    position: absolute;
    top: -50%;
    width: 200px;
    height: 200%;
    background: linear-gradient(180deg, transparent, rgba(108,92,231,0.03), transparent);
    animation: stadiumSweep 8s linear infinite;
}
.stadium-lights::before { left: 10%; animation-delay: 0s; }
.stadium-lights::after { right: 10%; animation-delay: 4s; }
@keyframes stadiumSweep {
    0% { transform: translateX(-100px) rotate(-15deg); }
    50% { transform: translateX(100px) rotate(15deg); }
    100% { transform: translateX(-100px) rotate(-15deg); }
}

/* Question entrance animation */
.question-area-animated {
    animation: questionSlideUp 0.4s ease-out;
}
@keyframes questionSlideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

/* Bracket match entrance */
.match-card {
    animation: bracketCardIn 0.4s ease both;
}
.bracket-round:nth-child(1) .match-card { animation-delay: 0s; }
.bracket-round:nth-child(2) .match-card { animation-delay: 0.15s; }
.bracket-round:nth-child(3) .match-card { animation-delay: 0.3s; }
.bracket-round:nth-child(4) .match-card { animation-delay: 0.45s; }
@keyframes bracketCardIn {
    from { transform: scale(0.9) translateY(10px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
}

/* Winner overlay enhanced */
.winner-overlay {
    background: radial-gradient(circle at center, rgba(10,14,39,0.95), rgba(10,14,39,1)) !important;
}

.admin-team-item button:first-of-type:hover { color: var(--team-a); background: rgba(108,92,231,0.1); }

function addTeam() {
    var name = document.getElementById('newTeamName').value.trim();
    if (!name) return;
    var image = document.getElementById('newTeamImage').value.trim();
    if (!image) image = DEFAULT_AVATARS[tournament.teams.length % DEFAULT_AVATARS.length];
    var membersInput = document.getElementById('newTeamMembers').value.trim();
    var members = membersInput ? membersInput.split(/[,،]/).map(function(m) { return m.trim(); }).filter(Boolean) : [];
    tournament.teams.push({ name: name, image: image, members: members, id: Date.now() });
    document.getElementById('newTeamName').value = '';
    document.getElementById('newTeamImage').value = '';
    document.getElementById('newTeamMembers').value = '';
    document.getElementById('teamImageFile').value = '';
    renderTeamsList();
    saveTournament();
}

function handleTeamImageUpload() {
    var fileInput = document.getElementById('teamImageFile');
    var file = fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        // Resize to 200x200 for storage efficiency
        var img = new Image();
        img.onload = function() {
            var canvas = document.createElement('canvas');
            canvas.width = 200;
            canvas.height = 200;
            var ctx = canvas.getContext('2d');
            var size = Math.min(img.width, img.height);
            var sx = (img.width - size) / 2;
            var sy = (img.height - size) / 2;
            ctx.drawImage(img, sx, sy, size, size, 0, 0, 200, 200);
            document.getElementById('newTeamImage').value = canvas.toDataURL('image/jpeg', 0.7);
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function removeTeam(id) {
    tournament.teams = tournament.teams.filter(function(t) { return t.id !== id; });

    team.members = input.split(/[,،]/).map(function(m) { return m.trim(); }).filter(Boolean);

function getSelectedQuestions() {
    var questions = [];
    var checkboxes = document.querySelectorAll('.admin-lesson-check input:checked');
    checkboxes.forEach(function(cb) {
        var subKey = cb.dataset.sub;
        var lessonIdx = parseInt(cb.dataset.lesson);
        if (SUBJECTS[subKey] && SUBJECTS[subKey].lessons[lessonIdx]) {
            SUBJECTS[subKey].lessons[lessonIdx].questions.forEach(function(q) {
                questions.push(Object.assign({}, q, { subject: subKey, lesson: lessonIdx }));
            });
        }
    });
    return questions;
}

// TOURNAMENT BRACKET LOGIC
// ============================================================
function startTournament() {
    var teamCount = tournament.teams.length;
    if (teamCount < 2) { alert('لازم فريقين على الأقل!'); return; }

    // Pad to nearest power of 2
    var size = 2;
    while (size < teamCount) size *= 2;

    tournament.questionsPerMatch = parseInt(document.getElementById('questionsPerMatch').value);
    tournament.timePerQuestion = parseInt(document.getElementById('timePerQuestion').value);
    tournament.name = document.getElementById('tournamentName').value.trim() || 'كأس مين البطل';
    tournament.rounds = Math.log2(size);
    tournament.matches = [];
    tournament.started = true;

    // Shuffle teams
    var shuffled = tournament.teams.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = t;
    }

    // Fill byes
    while (shuffled.length < size) shuffled.push(null);

    // Create round 1 matches
    for (var m = 0; m < size / 2; m++) {
        var match = {
            id: 'r1_m' + m,
            round: 1,
            pos: m,
            teamA: shuffled[m * 2],
            teamB: shuffled[m * 2 + 1],
            scoreA: 0,
            scoreB: 0,
            winner: null,
            status: 'pending'
        };
        // Auto-advance byes
        if (!match.teamA && match.teamB) { match.winner = match.teamB; match.status = 'done'; }
        else if (match.teamA && !match.teamB) { match.winner = match.teamA; match.status = 'done'; }
        else if (!match.teamA && !match.teamB) { match.status = 'done'; }
        tournament.matches.push(match);
    }

    // Create subsequent round matches (empty)
    for (var r = 2; r <= tournament.rounds; r++) {
        var matchesInRound = size / Math.pow(2, r);
        for (var mm = 0; mm < matchesInRound; mm++) {
            tournament.matches.push({
                id: 'r' + r + '_m' + mm,
                round: r,
                pos: mm,
                teamA: null,
                teamB: null,
                scoreA: 0,
                scoreB: 0,
                winner: null,
                status: 'pending'
            });
        }
    }

    // Advance byes
    advanceByes();

    document.getElementById('startTournamentBtn').style.display = 'none';
    document.getElementById('showBracketBtn').style.display = '';
    document.getElementById('resetBtn').style.display = '';

    saveTournament();
    showBracket();
}

function advanceByes() {
    for (var r = 1; r < tournament.rounds; r++) {
        var currentRound = tournament.matches.filter(function(m) { return m.round === r; });
        var nextRound = tournament.matches.filter(function(m) { return m.round === r + 1; });

        for (var i = 0; i < currentRound.length; i += 2) {
            var nextMatch = nextRound[Math.floor(i / 2)];
            if (!nextMatch) continue;
            if (currentRound[i].winner) {
                nextMatch.teamA = currentRound[i].winner;
            }
            if (currentRound[i + 1] && currentRound[i + 1].winner) {
                nextMatch.teamB = currentRound[i + 1].winner;
            }
            // Auto-advance if one team and other is bye
            if (nextMatch.teamA && !nextMatch.teamB && !currentRound[i + 1]) {
                nextMatch.winner = nextMatch.teamA;
                nextMatch.status = 'done';
            }
        }
    }
}

function resetTournament() {
    if (!confirm('متأكد؟ هيتم حذف كل بيانات البطولة!')) return;
    tournament.matches = [];
    tournament.started = false;
    tournament.rounds = 0;
    document.getElementById('startTournamentBtn').style.display = '';
    document.getElementById('showBracketBtn').style.display = 'none';
    document.getElementById('resetBtn').style.display = 'none';
    document.getElementById('matchControls').style.display = 'none';
    showView('setupView');
    saveTournament();
}

function renderBracket() {
    var container = document.getElementById('bracketContainer');
    var totalRounds = tournament.rounds;
    if (totalRounds < 1) return;

    var roundNames = [];
    if (totalRounds === 1) roundNames = ['النهائي'];
    else if (totalRounds === 2) roundNames = ['نصف النهائي', 'النهائي'];
    else if (totalRounds === 3) roundNames = ['ربع النهائي', 'نصف النهائي', 'النهائي'];
    else if (totalRounds === 4) roundNames = ['دور الـ16', 'ربع النهائي', 'نصف النهائي', 'النهائي'];
    else {
        for (var rr = 1; rr <= totalRounds; rr++) roundNames.push('الدور ' + rr);
    }

    // Build right side (rounds 1 to semi) + trophy + left side (mirrored for visual)
    // For RTL Arabic: right side = early rounds, left side = later rounds approaching center
    // We'll do a standard bracket: left rounds → trophy center ← right rounds (mirrored)

    var html = '';

    // Left half (top half of bracket)
    var leftMatches = [];
    var rightMatches = [];

    // Split round 1 matches into two halves
    var r1 = tournament.matches.filter(function(m) { return m.round === 1; });
    var half = Math.ceil(r1.length / 2);

    // For simplicity, render all rounds left-to-right with trophy in middle
    for (var round = 1; round <= totalRounds; round++) {
        var roundMatches = tournament.matches.filter(function(m) { return m.round === round; });
        var spacing = Math.pow(2, round - 1) * 16;

        html += '<div class="bracket-round" style="gap:' + spacing + 'px">';
        html += '<div class="round-label">' + roundNames[round - 1] + '</div>';

        roundMatches.forEach(function(match) {
            var isActive = match.status === 'active';
            var isPaused = match.status === 'paused';
            var cls = 'match-card' + (isActive ? ' active-match' : '') + (isPaused ? ' paused-match' : '');

            html += '<div class="' + cls + '" onclick="clickMatch(\'' + match.id + '\')">';

            // Team A
            if (match.teamA) {
                var winA = match.winner && match.winner.id === match.teamA.id;
                var loseA = match.winner && match.winner.id !== match.teamA.id;
                html += '<div class="match-team' + (winA ? ' winner' : '') + (loseA ? ' loser' : '') + '">';
                html += '<img class="match-team-img" src="' + match.teamA.image + '" onerror="this.src=\'' + DEFAULT_AVATARS[0] + '\'">';
                html += '<span class="match-team-name">' + match.teamA.name + '</span>';
                if (match.status === 'done' || match.status === 'active' || match.status === 'paused')
                    html += '<span class="match-team-score">' + match.scoreA + '</span>';
                html += '</div>';
            } else {
                html += '<div class="match-team-empty">—</div>';
            }

            // Team B
            if (match.teamB) {
                var winB = match.winner && match.winner.id === match.teamB.id;
                var loseB = match.winner && match.winner.id !== match.teamB.id;
                html += '<div class="match-team' + (winB ? ' winner' : '') + (loseB ? ' loser' : '') + '">';
                html += '<img class="match-team-img" src="' + match.teamB.image + '" onerror="this.src=\'' + DEFAULT_AVATARS[0] + '\'">';
                html += '<span class="match-team-name">' + match.teamB.name + '</span>';
                if (match.status === 'done' || match.status === 'active' || match.status === 'paused')
                    html += '<span class="match-team-score">' + match.scoreB + '</span>';
                html += '</div>';
            } else {
                html += '<div class="match-team-empty">—</div>';
            }

            if (match.teamA && match.teamB) {
                if (isPaused) {
                    html += '<div class="match-vs" style="color:var(--gold)"><i class="fas fa-pause"></i></div>';
                } else {
                    html += '<div class="match-vs">VS</div>';
                }
            }

            html += '</div>'; // match-card
        });

        html += '</div>'; // bracket-round
    }

    // Trophy
    var finalMatch = tournament.matches.filter(function(m) { return m.round === totalRounds; })[0];
    html += '<div class="bracket-trophy">';
    if (finalMatch && finalMatch.winner) {
        html += '<img src="' + finalMatch.winner.image + '" style="width:80px;height:80px;border-radius:50%;border:3px solid var(--gold);margin-bottom:8px" onerror="this.src=\'' + DEFAULT_AVATARS[0] + '\'">';
        html += '<div class="bracket-trophy-icon">🏆</div>';
        html += '<div class="bracket-trophy-label">' + finalMatch.winner.name + '</div>';
    } else {
        html += '<div class="bracket-trophy-icon">🏆</div>';
        html += '<div class="bracket-trophy-label">البطل</div>';
    }
    html += '</div>';

    container.innerHTML = html;
}

function clickMatch(matchId) {
    var match = tournament.matches.find(function(m) { return m.id === matchId; });
    if (!match) return;
    if (match.status === 'done') return;
    if (!match.teamA || !match.teamB) return;

    // Resume paused match
    if (match.status === 'paused' && match._savedMatchState) {
        resumeSavedMatch(match);
        return;
    }

    // Start new match
    startMatch(match);
}

function resumeSavedMatch(match) {
    currentMatch = match;
    match.status = 'active';
    var saved = match._savedMatchState;

    matchState.questions = saved.questions;
    matchState.currentQ = saved.currentQ;
    matchState.turn = saved.turn;
    matchState.scoreA = saved.scoreA;
    matchState.scoreB = saved.scoreB;
    matchState.answered = false;
    matchState.paused = false;
    matchState.revealed = false;

    delete match._savedMatchState;

    document.getElementById('matchControls').style.display = '';
    // Reset pause button state
    var icon = document.getElementById('pauseIcon');
    var text = document.getElementById('pauseText');
    if (icon) icon.className = 'fas fa-pause';
    if (text) text.textContent = 'إيقاف مؤقت';

    showView('matchView');
    renderScoreboard();
    showNextQuestion();
    saveTournament();
}

// ============================================================
// MATCH GAMEPLAY
// ============================================================
function startMatch(match) {
    currentMatch = match;
    match.status = 'active';
    match.scoreA = 0;
    match.scoreB = 0;

    // Get questions
    var allQ = getSelectedQuestions();
    if (allQ.length === 0) { alert('مفيش أسئلة! اختار مواد ودروس من لوحة التحكم'); return; }

    // Shuffle and pick
    shuffle(allQ);
    matchState.questions = allQ.slice(0, tournament.questionsPerMatch);
    matchState.currentQ = 0;
    matchState.turn = 'a';
    matchState.scoreA = 0;
    matchState.scoreB = 0;
    matchState.answered = false;

    document.getElementById('matchControls').style.display = '';
    // Reset pause button state
    var pIcon = document.getElementById('pauseIcon');
    var pText = document.getElementById('pauseText');
    if (pIcon) pIcon.className = 'fas fa-pause';
    if (pText) pText.textContent = 'إيقاف مؤقت';

    showView('matchView');
    renderScoreboard();

    // Show match intro animation
    showMatchIntro(match, function() {
        showNextQuestion();
    });
    saveTournament();
}

function showMatchIntro(match, callback) {
    var overlay = document.createElement('div');
    overlay.className = 'match-intro';
    overlay.id = 'matchIntro';

    var membersA = match.teamA.members && match.teamA.members.length > 0 ?
        '<div class="match-intro-members">' + match.teamA.members.join(' · ') + '</div>' : '';
    var membersB = match.teamB.members && match.teamB.members.length > 0 ?
        '<div class="match-intro-members">' + match.teamB.members.join(' · ') + '</div>' : '';

    overlay.innerHTML =
        '<img src="images/tournament-logo.png" style="width:80px;margin-bottom:8px;filter:drop-shadow(0 0 20px rgba(255,215,0,0.5));animation:setupLogoFloat 2s ease-in-out infinite">' +
        '<div class="match-intro-team">' +
            '<img src="' + match.teamA.image + '" onerror="this.src=\'' + DEFAULT_AVATARS[0] + '\'">' +
            '<div><h2>' + match.teamA.name + '</h2>' + membersA + '</div>' +
        '</div>' +
        '<div class="match-intro-vs">VS</div>' +
        '<div class="match-intro-team">' +
            '<img src="' + match.teamB.image + '" onerror="this.src=\'' + DEFAULT_AVATARS[0] + '\'">' +
            '<div><h2>' + match.teamB.name + '</h2>' + membersB + '</div>' +
        '</div>';

    document.body.appendChild(overlay);

    setTimeout(function() {
        if (overlay.parentNode) overlay.remove();
        if (callback) callback();
    }, 3000);
}

function renderScoreboard() {
    if (!currentMatch) return;
    var html = '';
    html += '<div class="scoreboard-team team-a' + (matchState.turn === 'a' ? ' active-turn' : '') + '">';
    html += '<img class="scoreboard-img" src="' + currentMatch.teamA.image + '" onerror="this.src=\'' + DEFAULT_AVATARS[0] + '\'">';
    html += '<div class="scoreboard-info"><h3>' + currentMatch.teamA.name + '</h3>';
    if (currentMatch.teamA.members && currentMatch.teamA.members.length > 0) {
        html += '<div class="scoreboard-members">' + currentMatch.teamA.members.join(' · ') + '</div>';
    }
    html += '</div>';
    html += '<div class="scoreboard-score" id="scoreA">' + matchState.scoreA + '</div>';
    html += '</div>';

    html += '<div class="scoreboard-vs">VS</div>';

    html += '<div class="scoreboard-team team-b' + (matchState.turn === 'b' ? ' active-turn' : '') + '">';
    html += '<div class="scoreboard-score" id="scoreB">' + matchState.scoreB + '</div>';
    html += '<div class="scoreboard-info"><h3>' + currentMatch.teamB.name + '</h3>';
    if (currentMatch.teamB.members && currentMatch.teamB.members.length > 0) {
        html += '<div class="scoreboard-members">' + currentMatch.teamB.members.join(' · ') + '</div>';
    }
    html += '</div>';
    html += '<img class="scoreboard-img" src="' + currentMatch.teamB.image + '" onerror="this.src=\'' + DEFAULT_AVATARS[0] + '\'">';
    html += '</div>';

    document.getElementById('scoreboard').innerHTML = html;

    var turnTeam = matchState.turn === 'a' ? currentMatch.teamA : currentMatch.teamB;
    var turnColor = matchState.turn === 'a' ? 'var(--team-a)' : 'var(--team-b)';
    document.getElementById('turnIndicator').innerHTML = '<span style="color:' + turnColor + '">🎯 دور: <strong>' + turnTeam.name + '</strong></span>';
}

function showNextQuestion() {
    if (matchState.currentQ >= matchState.questions.length) {
        endMatch();
        return;
    }

    matchState.answered = false;
    matchState.revealed = false;
    var q = matchState.questions[matchState.currentQ];
    var area = document.getElementById('questionArea');

    var counter = (matchState.currentQ + 1) + ' / ' + matchState.questions.length;
    var typeLabels = { mcq: 'اختر الإجابة', tf: 'صح ولا غلط', fill: 'أكمل' };

    var html = '<div class="question-counter">' + counter + '</div>';
    html += '<div class="question-type-badge">' + (typeLabels[q.type] || '') + '</div>';

    // Timer
    html += '<div class="match-timer" id="matchTimer">';
    html += '<svg class="timer-circle" viewBox="0 0 108 108"><circle class="timer-bg" cx="54" cy="54" r="50"/>';
    html += '<circle class="timer-fill" id="timerFill" cx="54" cy="54" r="50" stroke-dasharray="314" stroke-dashoffset="0"/></svg>';
    html += '<span id="timerText">' + tournament.timePerQuestion + '</span>';
    html += '</div>';

    // hiddenClass: if revealMode on, hide options initially
    var hiddenClass = matchState.revealMode ? ' options-hidden' : '';

    if (q.type === 'mcq') {
        html += '<div class="question-text">' + q.q + '</div>';
        html += '<div class="options-grid' + hiddenClass + '" id="optionsContainer">';
        var shapes = ['▲', '◆', '●', '★'];
        q.options.forEach(function(opt, idx) {
            html += '<button class="option-btn" id="opt-' + idx + '" onclick="answerQuestion(' + idx + ')">';
            html += '<span class="option-shape">' + shapes[idx] + '</span>';
            html += '<span>' + opt + '</span>';
            html += '</button>';
        });
        html += '</div>';
        if (matchState.revealMode) {
            html += '<button class="reveal-btn" id="revealBtn" onclick="revealOptions()"><i class="fas fa-eye"></i> اكشف الاختيارات!</button>';
        }
    } else if (q.type === 'tf') {
        html += '<div class="question-text">' + q.q + '</div>';
        html += '<div class="tf-grid' + hiddenClass + '" id="optionsContainer">';
        html += '<button class="tf-btn tf-true" id="opt-0" onclick="answerQuestion(0)"><i class="fas fa-check"></i> صح</button>';
        html += '<button class="tf-btn tf-false" id="opt-1" onclick="answerQuestion(1)"><i class="fas fa-times"></i> غلط</button>';
        html += '</div>';
        if (matchState.revealMode) {
            html += '<button class="reveal-btn" id="revealBtn" onclick="revealOptions()"><i class="fas fa-eye"></i> اكشف الاختيارات!</button>';
        }
    } else if (q.type === 'fill') {
        var displayText = q.q.replace('___', '<span class="blank">___</span>');
        html += '<div class="question-text">' + displayText + '</div>';
        html += '<div style="text-align:center;margin-top:16px">';
        html += '<div style="font-size:18px;color:var(--muted);margin-bottom:12px">الإجابة عند الأدمن — اضغط صح أو غلط</div>';
        html += '<div class="tf-grid">';
        html += '<button class="tf-btn tf-true" onclick="adminFillAnswer(true)"><i class="fas fa-check"></i> صح</button>';
        html += '<button class="tf-btn tf-false" onclick="adminFillAnswer(false)"><i class="fas fa-times"></i> غلط</button>';
        html += '</div>';
        html += '</div>';
    }

    area.innerHTML = html;
    area.classList.remove('question-area-animated');
    void area.offsetWidth; // trigger reflow
    area.classList.add('question-area-animated');
    renderScoreboard();

    // Show admin answer hint in sidebar
    updateAdminAnswerHint(q);

    // Timer: in reveal mode, don't start until revealed (for mcq/tf)
    if (matchState.revealMode && (q.type === 'mcq' || q.type === 'tf')) {
        // Timer paused until reveal
    } else {
        startTimer();
    }
}

function updateAdminAnswerHint(q) {
    var hint = document.getElementById('adminAnswerHint');
    var text = document.getElementById('adminAnswerText');
    if (!hint || !text) return;

    if (q.type === 'mcq') {
        text.textContent = q.options[q.correct];
        hint.style.display = '';
    } else if (q.type === 'tf') {
        text.textContent = q.correct === 0 ? '✅ صح' : '❌ غلط';
        hint.style.display = '';
    } else if (q.type === 'fill') {
        text.textContent = q.answer;
        hint.style.display = '';
    } else {
        hint.style.display = 'none';
    }
}

function revealOptions() {
    matchState.revealed = true;
    var container = document.getElementById('optionsContainer');
    var btn = document.getElementById('revealBtn');
    if (container) {
        container.classList.remove('options-hidden');
        container.classList.add('options-revealing');
    }
    if (btn) btn.remove();

    // Now start the timer
    startTimer();
}

function toggleRevealMode() {
    matchState.revealMode = document.getElementById('revealModeToggle').checked;
}

function startTimer() {
    matchState.timeLeft = tournament.timePerQuestion;
    if (matchState.timer) clearInterval(matchState.timer);

    matchState.timer = setInterval(function() {
        // Don't tick while paused
        if (matchState.paused) return;

        matchState.timeLeft -= 0.1;
        var pct = matchState.timeLeft / tournament.timePerQuestion;
        var offset = 314 * (1 - pct);

        var fill = document.getElementById('timerFill');
        var text = document.getElementById('timerText');
        var timer = document.getElementById('matchTimer');

        if (fill) {
            fill.style.strokeDashoffset = offset;
            if (matchState.timeLeft <= 5) {
                fill.classList.add('warning');
                if (timer) timer.classList.add('warning');
            }
        }
        if (text) text.textContent = Math.ceil(matchState.timeLeft);

        if (matchState.timeLeft <= 0) {
            clearInterval(matchState.timer);
            if (!matchState.answered) {
                matchState.answered = true;
                showFeedback(false);
                setTimeout(function() { nextTurn(); }, 1500);
            }
        }
    }, 100);
}

function answerQuestion(idx) {
    if (matchState.answered) return;
    matchState.answered = true;
    clearInterval(matchState.timer);

    var q = matchState.questions[matchState.currentQ];
    var correct = idx === q.correct;

    // Highlight correct/wrong
    var btn = document.getElementById('opt-' + idx);
    if (btn) btn.classList.add(correct ? 'correct' : 'wrong');

    // Show correct answer
    if (!correct) {
        var correctBtn = document.getElementById('opt-' + q.correct);
        if (correctBtn) correctBtn.classList.add('correct');
    }

    // Disable all
    document.querySelectorAll('.option-btn, .tf-btn').forEach(function(b) { b.classList.add('disabled'); });

    if (correct) {
        // Speed bonus
        var bonus = matchState.timeLeft > tournament.timePerQuestion * 0.6 ? 2 : 1;
        if (matchState.turn === 'a') matchState.scoreA += bonus;
        else matchState.scoreB += bonus;
        // Animate score bump
        var scoreId = matchState.turn === 'a' ? 'scoreA' : 'scoreB';
        var scoreEl = document.getElementById(scoreId);
        if (scoreEl) {
            scoreEl.textContent = matchState.turn === 'a' ? matchState.scoreA : matchState.scoreB;
            scoreEl.classList.add('score-bump');
            setTimeout(function() { scoreEl.classList.remove('score-bump'); }, 500);
        }
    }

    showFeedback(correct);
    setTimeout(function() { nextTurn(); }, 1800);
}

function adminFillAnswer(correct) {
    if (matchState.answered) return;
    matchState.answered = true;
    clearInterval(matchState.timer);

    if (correct) {
        var bonus = matchState.timeLeft > tournament.timePerQuestion * 0.6 ? 2 : 1;
        if (matchState.turn === 'a') matchState.scoreA += bonus;
        else matchState.scoreB += bonus;
    }

    showFeedback(correct);
    setTimeout(function() { nextTurn(); }, 1800);
}

function showFeedback(correct) {
    var overlay = document.createElement('div');
    overlay.className = 'answer-feedback ' + (correct ? 'feedback-correct' : 'feedback-wrong');
    overlay.innerHTML = '<div style="text-align:center"><div class="feedback-icon">' +
        (correct ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-times-circle"></i>') +
        '</div><div class="feedback-text" style="color:' + (correct ? 'var(--correct)' : 'var(--wrong)') + '">' +
        (correct ? 'إجابة صحيحة! 🎉' : 'إجابة خاطئة ❌') + '</div></div>';
    document.body.appendChild(overlay);

    setTimeout(function() { if (overlay.parentNode) overlay.remove(); }, 1500);
}

function nextTurn() {
    matchState.currentQ++;
    matchState.turn = matchState.turn === 'a' ? 'b' : 'a';

    if (matchState.currentQ >= matchState.questions.length) {
        endMatch();
        return;
    }

    // Show turn transition
    var turnTeam = matchState.turn === 'a' ? currentMatch.teamA : currentMatch.teamB;
    var overlay = document.createElement('div');
    overlay.className = 'waiting-overlay';
    overlay.innerHTML = '<div class="waiting-text">🎯 دور ' + turnTeam.name + '</div>' +
        '<div class="waiting-sub">استعد...</div>';
    document.body.appendChild(overlay);

    setTimeout(function() {
        if (overlay.parentNode) overlay.remove();
        showNextQuestion();
    }, 1500);
}

function endMatch() {
    clearInterval(matchState.timer);

    currentMatch.scoreA = matchState.scoreA;
    currentMatch.scoreB = matchState.scoreB;

    if (matchState.scoreA > matchState.scoreB) {
        currentMatch.winner = currentMatch.teamA;
    } else if (matchState.scoreB > matchState.scoreA) {
        currentMatch.winner = currentMatch.teamB;
    } else {
        // Tie — random (admin can override)
        currentMatch.winner = Math.random() > 0.5 ? currentMatch.teamA : currentMatch.teamB;
    }
    currentMatch.status = 'done';

    // Advance winner to next round
    advanceWinner(currentMatch);
    document.getElementById('matchControls').style.display = 'none';

    // Show winner celebration
    showWinnerCelebration(currentMatch);
    saveTournament();
}

function advanceWinner(match) {
    var nextRound = match.round + 1;
    var nextPos = Math.floor(match.pos / 2);
    var nextMatch = tournament.matches.find(function(m) {
        return m.round === nextRound && m.pos === nextPos;
    });
    if (!nextMatch) return; // was the final

    if (match.pos % 2 === 0) {
        nextMatch.teamA = match.winner;
    } else {
        nextMatch.teamB = match.winner;
    }
}

function showWinnerCelebration(match) {
    launchConfetti();

    var overlay = document.createElement('div');
    overlay.className = 'winner-overlay';
    overlay.id = 'winnerOverlay';

    var isFinal = match.round === tournament.rounds;
    var title = isFinal ? 'بطل البطولة!' : 'فاز بالماتش!';

    var winnerMembers = match.winner.members && match.winner.members.length > 0 ?
        '<div style="color:var(--muted);font-size:14px;margin-top:4px">' + match.winner.members.join(' · ') + '</div>' : '';

    overlay.innerHTML =
        '<img src="images/tournament-logo.png" style="width:' + (isFinal ? '100px' : '60px') + ';filter:drop-shadow(0 0 30px rgba(255,215,0,0.6));animation:setupLogoFloat 2s ease-in-out infinite;margin-bottom:8px">' +
        '<div class="winner-trophy">' + (isFinal ? '🏆' : '⭐') + '</div>' +
        '<div class="winner-text">' + title + '</div>' +
        '<img class="winner-team-img" src="' + match.winner.image + '" onerror="this.src=\'' + DEFAULT_AVATARS[0] + '\'">' +
        '<div class="winner-team-name">' + match.winner.name + '</div>' +
        winnerMembers +
        '<div class="winner-score">' + match.scoreA + ' - ' + match.scoreB + '</div>' +
        '<button class="admin-btn primary" onclick="closeWinnerAndShowBracket()" style="width:auto;padding:16px 40px;font-size:18px">' +
        '<i class="fas fa-sitemap"></i> ' + (isFinal ? 'عرض النتيجة' : 'الماتش التالي') + '</button>';

    document.body.appendChild(overlay);
}

function closeWinnerAndShowBracket() {
    var ov = document.getElementById('winnerOverlay');
    if (ov) ov.remove();
    currentMatch = null;
    showBracket();
}

function launchConfetti() {
    var colors = ['#FFD700', '#FF6B6B', '#6C5CE7', '#00CEC9', '#FDCB6E', '#FD79A8', '#00B894'];
    var shapes = ['■', '●', '▲', '★', '♦', '✝'];
    for (var i = 0; i < 80; i++) {
        var piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.textContent = shapes[Math.floor(Math.random() * shapes.length)];
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.color = colors[Math.floor(Math.random() * colors.length)];
        piece.style.fontSize = (10 + Math.random() * 16) + 'px';
        piece.style.animationDuration = (2 + Math.random() * 2) + 's';
        piece.style.animationDelay = Math.random() * 0.5 + 's';
        document.body.appendChild(piece);
        setTimeout(function(el) { if (el.parentNode) el.remove(); }.bind(null, piece), 4000);
    }
}

// ============================================================
// PAUSE / RESUME
// ============================================================
function togglePauseMatch() {
    if (!currentMatch) return;
    if (matchState.paused) {
        resumeMatch();
    } else {
        pauseMatch();
    }
}

function pauseMatch() {
    matchState.paused = true;
    clearInterval(matchState.timer);

    // Update admin button
    var icon = document.getElementById('pauseIcon');
    var text = document.getElementById('pauseText');
    if (icon) icon.className = 'fas fa-play';
    if (text) text.textContent = 'استكمال';

    // Show pause overlay
    var overlay = document.createElement('div');
    overlay.className = 'pause-overlay';
    overlay.id = 'pauseOverlay';
    overlay.innerHTML =
        '<div class="pause-icon"><i class="fas fa-pause-circle"></i></div>' +
        '<div class="pause-text">اللعبة متوقفة</div>' +
        '<div class="pause-sub">اضغط P أو زرار الاستكمال من لوحة التحكم</div>' +
        '<button class="pause-resume-btn" onclick="resumeMatch()"><i class="fas fa-play"></i> استكمال</button>';
    document.body.appendChild(overlay);
}

function resumeMatch() {
    matchState.paused = false;

    // Update admin button
    var icon = document.getElementById('pauseIcon');
    var text = document.getElementById('pauseText');
    if (icon) icon.className = 'fas fa-pause';
    if (text) text.textContent = 'إيقاف مؤقت';

    // Remove pause overlay
    var overlay = document.getElementById('pauseOverlay');
    if (overlay) overlay.remove();

    // Resume timer if question is still active and options are revealed (or not in reveal mode)
    if (!matchState.answered) {
        var q = matchState.questions[matchState.currentQ];
        if (!matchState.revealMode || matchState.revealed || q.type === 'fill') {
            startTimer();
        }
    }
}

function adminPauseAndSave() {
    if (!currentMatch) return;
    if (!confirm('إيقاف الماتش وحفظ الحالة؟ تقدر تكمل بعدين')) return;

    clearInterval(matchState.timer);

    // Save match state
    currentMatch.scoreA = matchState.scoreA;
    currentMatch.scoreB = matchState.scoreB;
    currentMatch.status = 'paused';
    currentMatch._savedMatchState = {
        questions: matchState.questions,
        currentQ: matchState.currentQ,
        turn: matchState.turn,
        scoreA: matchState.scoreA,
        scoreB: matchState.scoreB
    };

    document.getElementById('matchControls').style.display = 'none';
    saveTournament();
    showBracket();
}

// ============================================================
// ADMIN MATCH CONTROLS
// ============================================================
function adminNextQuestion() {
    if (!currentMatch) return;
    if (matchState.paused) return; // don't advance while paused
    clearInterval(matchState.timer);
    matchState.answered = true;
    nextTurn();
}

function adminSkipQuestion() {
    if (!currentMatch) return;
    clearInterval(matchState.timer);
    matchState.answered = true;
    matchState.currentQ++;
    // Don't switch turn for skip
    if (matchState.currentQ >= matchState.questions.length) {
        endMatch();
    } else {
        showNextQuestion();
    }
}

function adminEndMatch() {
    if (!currentMatch) return;
    if (!confirm('إنهاء الماتش بالنتيجة الحالية؟')) return;
    endMatch();
}

function adminAddPoint(team) {
    if (!currentMatch) return;
    if (team === 'a') matchState.scoreA++;
    else matchState.scoreB++;
    renderScoreboard();
}

function adminRemovePoint(team) {
    if (!currentMatch) return;
    if (team === 'a') matchState.scoreA = Math.max(0, matchState.scoreA - 1);
    else matchState.scoreB = Math.max(0, matchState.scoreB - 1);
    renderScoreboard();
}

function adminForceWinner(team) {
    if (!currentMatch) return;
    if (!confirm('تأكيد فوز الفريق؟')) return;
    clearInterval(matchState.timer);
    currentMatch.scoreA = matchState.scoreA;
    currentMatch.scoreB = matchState.scoreB;
    currentMatch.winner = team === 'a' ? currentMatch.teamA : currentMatch.teamB;
    currentMatch.status = 'done';
    advanceWinner(currentMatch);
    document.getElementById('matchControls').style.display = 'none';
    showWinnerCelebration(currentMatch);
    saveTournament();
}

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    if (e.key === 'a' || e.key === 'A' || e.key === 'ش') toggleAdmin();
    if (e.key === 'f' || e.key === 'F' || e.key === 'ب') toggleFullscreen();
    if (e.key === 'p' || e.key === 'P' || e.key === 'ح') { e.preventDefault(); togglePauseMatch(); }
    if (e.key === 'r' || e.key === 'R' || e.key === 'ق') {
        e.preventDefault();
        var revBtn = document.getElementById('revealBtn');
        if (revBtn) revBtn.click();
    }
    if (e.key === ' ') {
        e.preventDefault();
        // If paused, resume instead
        if (matchState.paused) { resumeMatch(); return; }
        adminNextQuestion();
    }
    if (e.key === '1') { var b = document.getElementById('opt-0'); if (b) b.click(); }
    if (e.key === '2') { var b = document.getElementById('opt-1'); if (b) b.click(); }
    if (e.key === '3') { var b = document.getElementById('opt-2'); if (b) b.click(); }
    if (e.key === '4') { var b = document.getElementById('opt-3'); if (b) b.click(); }
    if (e.key === 'Escape') {
        // If paused overlay is showing, resume
        var pauseOv = document.getElementById('pauseOverlay');
        if (pauseOv) { resumeMatch(); return; }
        var ov = document.getElementById('winnerOverlay');
        if (ov) { closeWinnerAndShowBracket(); return; }
        if (document.getElementById('matchView').classList.contains('active')) {
            showBracket();
        }
    }
});

// ============================================================
// PERSISTENCE (localStorage)
// ============================================================
function saveTournament() {
    try {
        localStorage.setItem('minElBatal_tournament', JSON.stringify(tournament));
    } catch(e) {}
}

function loadTournament() {
    try {
        var saved = localStorage.getItem('minElBatal_tournament');
        if (saved) {
            var data = JSON.parse(saved);
            if (data.started) {
                tournament = data;
                document.getElementById('startTournamentBtn').style.display = 'none';
                document.getElementById('showBracketBtn').style.display = '';
                document.getElementById('resetBtn').style.display = '';
                renderTeamsList();
                showBracket();
                return;
            } else if (data.teams && data.teams.length > 0) {
                tournament.teams = data.teams;
            }
        }
    } catch(e) {}
    renderTeamsList();
}

// ============================================================
// UTILS
// ============================================================
function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
}

// ============================================================
// INIT
// ============================================================
renderSubjectPicker();
loadTournament();
</script>
